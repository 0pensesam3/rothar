# Daily UX check: a tester, a fixer and a judge, each a separate Claude session.
#
#   1. Tester  runs the checks, looks at the screenshots, writes the day's report
#              and ranks up to three app bugs. Can't change code.
#   2. Fixer   takes ONE bug at a time and changes index.html for it only. The workflow
#              opens a draft PR for that bug alone.
#   3. Judge   two sessions. First it reads the diff cold, with nothing else on the machine.
#              Then it gets the bug's ID, the expectations and fresh check results, and
#              looks for a reason to reject. Never sees the tester's or fixer's writing.
#
# After the judge:
#   PASS or CONCERNS  the draft is marked ready and Anya is tagged. That's the only time she hears.
#   FAIL              the fixer revises the SAME PR with the judge's reasons (it keeps what worked),
#                     up to MAX_ATTEMPTS. Still failing: the PR is closed as parked and the
#                     fixer starts on the tester's next bug. Nothing left: one message to Anya.
#
# Nothing here merges. Merging an agent PR runs the check again. If a run breaks, Anya is
# tagged on the Daily UX report issue. Setup steps are in .github/ux-agent/README.md.

name: Daily UX check

on:
  schedule:
    - cron: "12 11 * * *"       # 11:12 UTC: 12:12 in summer, 11:12 in winter (London)
  workflow_dispatch:
    inputs:
      fix:
        description: "Let the fixer open a PR if the tester finds something"
        type: boolean
        default: true
      # The rest are set by the workflow when it hands work to the next round. Leave them alone.
      findings_run:
        description: "(internal) Run whose tester findings to keep working on"
        type: string
        default: ""
      bug:
        description: "(internal) Which of the tester's picks to work on, from 0"
        type: string
        default: "0"
      attempt:
        description: "(internal) Attempt number on this bug"
        type: string
        default: "1"
      pr:
        description: "(internal) PR to revise"
        type: string
        default: ""
      retry_of:
        description: "(internal) Run whose judge verdict this attempt answers"
        type: string
        default: ""
  pull_request:
    types: [closed]             # a merged agent PR starts the next check straight away

concurrency:
  group: daily-ux
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  REAL_TILES: "1"               # real map tiles in screenshots; the checks themselves use fake London
  MAX_ATTEMPTS: "3"             # attempts per bug; the last one goes to Anya if the judge says it is safe
  FINDINGS_RUN: ${{ inputs.findings_run || github.run_id }}
  CONTINUING: ${{ (inputs.findings_run || '') != '' }}
  BUG: ${{ inputs.bug || '0' }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  PR_IN: ${{ inputs.pr || '' }}
  RETRY_OF: ${{ inputs.retry_of || '' }}
  BASE: ${{ github.event.repository.default_branch }}
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  RUN_ID: ${{ github.run_id }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  test:
    name: "1 · Tester"
    # Later rounds keep the morning's findings, so the tester runs once per check
    if: >-
      (inputs.findings_run || '') == '' && (
        github.event_name != 'pull_request' ||
        (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'ux-agent'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      fix_count: ${{ steps.pick.outputs.fix_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run the checks (fake London and live data)
        continue-on-error: true
        run: npx playwright test

      - name: Summarise results
        run: |
          node tests/support/summarise.mjs ux-run/results.json > ux-run/summary.md
          cat ux-run/summary.md >> "$GITHUB_STEP_SUMMARY"

      # How the tester's recent findings turned out, so it knows what was worth flagging
      - name: Tester's track record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$REPO" --label ux-agent --state all --limit 10 \
            --json number,title,state,mergedAt,closedAt,labels \
            -q '[.[] | {number, title, outcome: (if .mergedAt then "merged by Anya" elif (.labels|map(.name)|index("ux-parked")) then "parked: the judge rejected every attempt" elif .state=="CLOSED" then "closed by Anya without merging" else "waiting for Anya" end), labels: [.labels[].name]}]' \
            > ux-run/track-record.json || echo '[]' > ux-run/track-record.json

      # continue-on-error: a turn overrun shouldn't kill a run whose report is already written.
      # The next step decides whether the failure was real.
      - name: Tester agent
        id: tester
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Read .github/ux-agent/tester.md and do exactly what it says."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit(ux-run/**)"

      - name: Why the tester stopped
        if: steps.tester.outcome == 'failure'
        env:
          OUT: ${{ steps.tester.outputs.execution_file }}
        run: bash .github/ux-agent/agent-stopped.sh tester "$OUT"

      - name: Did the tester write its report?
        run: |
          for f in ux-run/report.md ux-run/findings.json; do
            [ -s "$f" ] || { echo "::error::The tester finished but didn't write $f. Check its tool permissions."; exit 1; }
          done

      - name: How many bugs to fix today
        id: pick
        if: always()
        run: |
          n=$(node -e "try{const f=require('./ux-run/findings.json');console.log(Math.min(3,(f.fix_now||[]).length))}catch(e){console.log(0)}")
          echo "fix_count=$n" >> "$GITHUB_OUTPUT"
          echo "Bugs picked for the fixer: $n"

      - name: Post the report to the Daily UX report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ux-report --color 0e8a16 --description "Daily UX check reports" 2>/dev/null || true
          num=$(gh issue list --label ux-report --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Daily UX report" --label ux-report \
              --body "The daily UX check posts one comment here per run. Screenshots and full results are attached to each run.")
            num=${url##*/}
          fi
          {
            echo "### $(date -u +'%a %-d %b %Y') · [run]($RUN_URL)"
            echo
            if [ -f ux-run/report.md ]; then cat ux-run/report.md; else echo "The tester didn't write a report. Results summary:"; echo; cat ux-run/summary.md; fi
          } > comment.md
          gh issue comment "$num" --body-file comment.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-tester
          path: |
            ux-run/
            !ux-run/html/
          retention-days: 14
          include-hidden-files: false

  gate:
    name: "Is a fix PR already waiting?"
    needs: test
    if: needs.test.outputs.fix_count != '' && needs.test.outputs.fix_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.fix)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      waiting: ${{ steps.check.outputs.waiting }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --repo "$REPO" --label ux-agent --state open --json number -q '.[0].number')
          echo "waiting=$open" >> "$GITHUB_OUTPUT"
          if [ -n "$open" ]; then
            gh pr comment "$open" --repo "$REPO" --body "Today's check ran again. No new fix was opened while this one is waiting for you. Today's findings are in the Daily UX report issue."
          fi

  fix:
    name: "2 · Fixer"
    needs: [test, gate]
    # A fresh check with nothing waiting, or a later round handed on by the workflow itself
    if: >-
      !cancelled() && (
        (needs.gate.result == 'success' && needs.gate.outputs.waiting == '') ||
        (inputs.findings_run || '') != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write              # to hand on to the next bug if this one can't be fixed
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      bug_id: ${{ steps.bug.outputs.id }}
      bug_title: ${{ steps.bug.outputs.title }}
      bug_count: ${{ steps.bug.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci && npx playwright install --with-deps chromium

      - name: Get the tester's findings (this run)
        if: env.CONTINUING != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ux-tester
          path: ux-run-tester

      - name: Get the tester's findings (from the morning's run)
        if: env.CONTINUING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ux-tester
          run-id: ${{ env.FINDINGS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ux-run-tester

      - name: Which bug this round is for
        id: bug
        run: |
          node -e '
            const fs = require("fs"), f = require("./ux-run-tester/findings.json");
            const picks = (f.fix_now || []).slice(0, 3), b = picks[+process.env.BUG];
            const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${String(v).replace(/\s+/g, " ")}\n`);
            out("count", picks.length);
            if (!b) { console.log("No bug at position", process.env.BUG); process.exit(0); }
            fs.writeFileSync("ux-run-tester/bug.json", JSON.stringify(b, null, 2));
            out("id", b.id); out("title", b.title);
            console.log(`Bug ${+process.env.BUG + 1} of ${picks.length}: ${b.id} ${b.title}, attempt ${process.env.ATTEMPT}`);
          '

      - name: Pick up the previous attempt
        id: prev
        if: steps.bug.outputs.id != '' && env.PR_IN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh api "repos/$REPO/pulls/$PR_IN" --jq .head.ref)
          git fetch -q origin "$branch"
          git checkout -q -B "$branch" "origin/$branch"
          mkdir -p ux-run-prev
          git diff "origin/$BASE...HEAD" > ux-run-prev/attempt.diff
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Revising $branch (PR #$PR_IN):"; git diff --stat "origin/$BASE...HEAD"

      - name: Get the judge's reasons from the last attempt
        if: steps.bug.outputs.id != '' && env.RETRY_OF != ''
        uses: actions/download-artifact@v4
        with:
          name: ux-judge
          run-id: ${{ env.RETRY_OF }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/prev

      - name: Keep only the verdict
        if: steps.bug.outputs.id != '' && env.RETRY_OF != ''
        run: |
          mkdir -p ux-run-prev
          cp "$RUNNER_TEMP/prev/ux-run-judge/verdict.md" ux-run-prev/verdict.md
          rm -rf "$RUNNER_TEMP/prev"

      - name: Fixer agent
        id: fixer
        if: steps.bug.outputs.id != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Read .github/ux-agent/fixer.md and do exactly what it says."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit(index.html),Edit(ux-run/**),Bash(npx playwright test:*)"

      # A turn overrun carries on: the guard below and the judge decide whether the change is any good
      - name: Why the fixer stopped
        if: steps.fixer.outcome == 'failure'
        env:
          OUT: ${{ steps.fixer.outputs.execution_file }}
        run: bash .github/ux-agent/agent-stopped.sh fixer "$OUT"

      # The fixer may change index.html and nothing else. Checked here, outside the agent.
      - name: Check which files the fixer changed
        id: guard
        if: steps.bug.outputs.id != ''
        run: |
          changed=$(git status --porcelain --untracked-files=all | sed 's/^...//' | sort -u)
          echo "Changed files:"; echo "${changed:-none}"
          other=$(echo "$changed" | grep -v -x 'index.html' | grep -v '^$' || true)
          if [ -n "$other" ]; then
            echo "::error::The fixer changed files it isn't allowed to touch: $other"
            exit 1
          fi
          if [ -z "$changed" ]; then echo "has_change=" >> "$GITHUB_OUTPUT"; else echo "has_change=1" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the pull request
        id: pr
        if: steps.guard.outputs.has_change == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUG_ID: ${{ steps.bug.outputs.id }}
          BUG_TITLE: ${{ steps.bug.outputs.title }}
        run: |
          if [ -f ux-run/fix-notes.md ]; then
            title=$(head -n1 ux-run/fix-notes.md | sed 's/^#* *//' | cut -c1-80)
            tail -n +2 ux-run/fix-notes.md > notes.md
          else
            title=""; echo "The fixer left no notes." > notes.md
          fi
          [ -n "$title" ] || title="Fix $BUG_ID: $BUG_TITLE"
          {
            echo "**For:** $BUG_ID $BUG_TITLE"
            echo
            cat notes.md
            echo; echo "---"
            echo "Opened by the daily UX check ([run]($RUN_URL)), attempt $ATTEMPT of $MAX_ATTEMPTS. The tester's report is in the Daily UX report issue."
            echo "This stays a draft until a separate judge passes it. The judge reads the diff first and never sees this description."
            echo "Nothing merges automatically. Merging this starts the next check."
          } > body.md
          git config user.name "rothar-ux-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -n "$PR_IN" ]; then
            # Same PR, new commit: the judge's earlier comments stay on it, so you see the whole story
            branch="${{ steps.prev.outputs.branch }}"
            git commit -q -m "Attempt $ATTEMPT: $title" -m "Revised after the judge's FAIL. Daily UX check run $RUN_ID."
            git push -q origin "$branch"
            gh pr edit "$PR_IN" --repo "$REPO" --body-file body.md --remove-label judge-fail 2>/dev/null || gh pr edit "$PR_IN" --repo "$REPO" --body-file body.md
            number=$PR_IN
          else
            branch="ux-fix/$(date -u +%Y-%m-%d)-$(echo "$BUG_ID" | tr 'A-Z' 'a-z')-run${{ github.run_number }}"
            git checkout -q -b "$branch"
            git commit -q -m "$title" -m "From the daily UX check, run $RUN_ID. For $BUG_ID."
            git push -q origin "$branch"
            gh label create ux-agent --color 5319e7 --description "Opened by the daily UX agent" 2>/dev/null || true
            # A draft, so GitHub doesn't ask you (as code owner) to review until the judge passes it
            gh pr create --draft --base "$BASE" --head "$branch" --title "$title" --body-file body.md --label ux-agent
            number=$(gh pr view "$branch" --json number -q .number)
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The fixer made no change: park this bug and move on, rather than stopping the day
      - name: Fixer couldn't fix it, move on
        if: steps.bug.outputs.id != '' && steps.guard.outputs.has_change == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ env.PR_IN }}
          BUG_COUNT: ${{ steps.bug.outputs.count }}
          BUG_ID: ${{ steps.bug.outputs.id }}
        run: |
          why="The fixer couldn't find a change for $BUG_ID on attempt $ATTEMPT."
          [ -f ux-run/fix-notes.md ] && why="$why Its notes: $(tail -n +2 ux-run/fix-notes.md | tr '\n' ' ' | cut -c1-300)"
          if [ -n "$PR" ]; then
            gh label create ux-parked --color 6e7781 --description "The judge rejected every attempt; left for later" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label ux-parked
            gh pr close "$PR" --repo "$REPO" --delete-branch --comment "Parked. $why"
          else
            issue=$(gh issue list --repo "$REPO" --label ux-report --state open --json number -q '.[0].number')
            [ -n "$issue" ] && gh issue comment "$issue" --repo "$REPO" --body "$why Moving on. ([run]($RUN_URL))"
          fi
          bash .github/ux-agent/next-round.sh next-bug

  judge:
    name: "3 · Judge"
    needs: [fix]
    if: needs.fix.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write             # to delete the branch of a parked fix
      pull-requests: write
      issues: write
      actions: write              # to start the next attempt or the next bug
    env:
      PR: ${{ needs.fix.outputs.pr }}
      BUG_ID: ${{ needs.fix.outputs.bug_id }}
      BUG_TITLE: ${{ needs.fix.outputs.bug_title }}
      BUG_COUNT: ${{ needs.fix.outputs.bug_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.fix.outputs.branch }}
          fetch-depth: 0

      # Step A: the diff and nothing else. No tester output, no fixer notes, no test results
      # exist on this machine yet, so the first read can't lean on them. On a revision the
      # diff is the whole branch against main, so the judge always sees the change as it stands.
      - name: Save the diff
        run: |
          mkdir -p ux-run-judge
          git diff "origin/$BASE...HEAD" > ux-run-judge/fix.diff
          echo "Files in the diff:"; git diff --name-only "origin/$BASE...HEAD"

      - name: Judge reads the diff cold
        id: first_read
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Read .github/ux-agent/judge-first-read.md and do exactly what it says."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 35
            --allowedTools "Read,Glob,Grep,Edit(ux-run-judge/first-read.md)"

      - name: Why the judge stopped (cold read)
        if: steps.first_read.outcome == 'failure'
        env:
          OUT: ${{ steps.first_read.outputs.execution_file }}
        run: bash .github/ux-agent/agent-stopped.sh "judge (cold read)" "$OUT"

      - name: Did the judge write its first read?
        run: |
          [ -s ux-run-judge/first-read.md ] || { echo "::error::The judge didn't write ux-run-judge/first-read.md."; exit 1; }

      # Step B: now the evidence. Only machine output from the tester's run, plus the ID.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci && npx playwright install --with-deps chromium

      - name: Get the tester's results (this run)
        if: env.CONTINUING != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ux-tester
          path: ${{ runner.temp }}/tester

      - name: Get the tester's results (from the morning's run)
        if: env.CONTINUING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ux-tester
          run-id: ${{ env.FINDINGS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/tester

      - name: Keep only check results and the ID to fix
        run: |
          mkdir -p ux-run-before
          for f in summary.md results.json screens test-output; do
            if [ -e "$RUNNER_TEMP/tester/$f" ]; then cp -r "$RUNNER_TEMP/tester/$f" ux-run-before/; fi
          done
          echo "$BUG_ID" > ux-run-before/fix-ids.txt
          echo "ID to judge: $BUG_ID"
          rm -rf "$RUNNER_TEMP/tester"     # the tester's report and findings never reach the judge

      - name: Run every check on the fix branch
        continue-on-error: true
        run: npx playwright test

      - name: Summarise results
        run: |
          node tests/support/summarise.mjs ux-run/results.json > ux-run/summary.md
          cat ux-run/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Judge agent
        id: judge
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Read .github/ux-agent/judge.md and do exactly what it says."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 55
            --allowedTools "Read,Glob,Grep,Edit(ux-run-judge/verdict.md)"

      # A turn overrun carries on: no verdict file means the next step posts CONCERNS, never a pass
      - name: Why the judge stopped
        if: steps.judge.outcome == 'failure'
        env:
          OUT: ${{ steps.judge.outputs.execution_file }}
        run: bash .github/ux-agent/agent-stopped.sh judge "$OUT"

      - name: Post the verdict on the PR
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f ux-run-judge/verdict.md ]; then printf 'VERDICT: CONCERNS\n\nThe judge did not write a verdict. Treat this PR as unreviewed.\n' > ux-run-judge/verdict.md; fi
          verdict=$(head -n1 ux-run-judge/verdict.md | sed -n 's/^VERDICT: *\([A-Z]*\).*/\1/p')
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          # What happens next. The judge never knows which attempt this is; the workflow decides.
          #   ready   PASS or CONCERNS
          #   best    FAIL on the last attempt, but the judge says it's safe: give Anya the best version so far
          #   retry   FAIL with attempts left
          #   park    FAIL on the last attempt and not safe to merge
          safe=$(sed -n 's/^SAFE: *//p' ux-run-judge/verdict.md | head -n1 | tr 'A-Z' 'a-z' | cut -c1-3)
          if [ "$verdict" != "FAIL" ]; then outcome=ready
          elif [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then outcome=retry
          elif [ "$safe" = "yes" ]; then outcome=best
          else outcome=park; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Verdict $verdict, safe '${safe:-not given}', attempt $ATTEMPT of $MAX_ATTEMPTS: $outcome"
          {
            echo "## Judge · attempt $ATTEMPT of $MAX_ATTEMPTS"; echo; cat ux-run-judge/verdict.md; echo
            echo "<details><summary>The judge's cold read of the diff (written before it saw anything else)</summary>"; echo; cat ux-run-judge/first-read.md; echo "</details>"
            echo "<details><summary>Check results on this branch</summary>"; echo; cat ux-run/summary.md; echo "</details>"
          } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          case "$verdict" in
            PASS) label=judge-pass; colour=0e8a16 ;;
            FAIL) label=judge-fail; colour=b60205 ;;
            *)    label=judge-concerns; colour=fbca04 ;;
          esac
          gh label create "$label" --color "$colour" 2>/dev/null || true
          for old in judge-pass judge-fail judge-concerns; do gh pr edit "$PR" --repo "$REPO" --remove-label "$old" >/dev/null 2>&1 || true; done
          gh pr edit "$PR" --repo "$REPO" --add-label "$label"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-judge
          path: |
            ux-run/
            ux-run-judge/
            !ux-run/html/
          retention-days: 14

      # PASS or CONCERNS: ready for review, and tell Anya. This is the only time she's pinged about a fix.
      - name: Ready for you
        if: steps.verdict.outputs.outcome == 'ready' || steps.verdict.outputs.outcome == 'best'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          OUTCOME: ${{ steps.verdict.outputs.outcome }}
        run: |
          line() { sed -n "s/^$1: *//p" ux-run-judge/verdict.md | head -n1 | cut -c1-160; }
          change=$(line CHANGE); [ -n "$change" ] || change=$(gh pr view "$PR" --repo "$REPO" --json title -q .title)
          reason=$(line REASON)
          stat=$(git diff --shortstat "origin/$BASE...HEAD" | sed 's/^ *//')
          # Earlier attempts on this PR: every judge comment except the one just posted
          earlier=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body|startswith("## Judge"))] | .[:-1][] | .body' |
                    awk '/^## Judge/{n++} /^REASON:/{sub(/^REASON: */,""); printf "- Attempt %d: %s\n", n, substr($0,1,160)}')
          # Other bugs parked today
          parked=$(gh pr list --repo "$REPO" --label ux-parked --state closed --search "closed:>=$(date -u +%F)" --json number,title -q '.[] | "- #\(.number) \(.title)"')
          case "$OUTCOME:$VERDICT" in
            best:*) head="🟠 Best attempt after $MAX_ATTEMPTS tries. The judge still objects (below), but says it leaves the app no worse than now. Your call."
                    gh label create judge-best-effort --color d93f0b --description "Last attempt: not passed, but judged safe to merge" 2>/dev/null || true
                    gh pr edit "$PR" --repo "$REPO" --add-label judge-best-effort ;;
            *:PASS) head="✅ Judge passed this. Ready for you to merge." ;;
            *)      head="🟡 Judge found nothing to reject, but wants a real ride before you merge." ;;
          esac
          {
            echo "@$OWNER $head"
            echo
            echo "**Changed:** $change ($stat)"
            echo "**For:** $BUG_ID $BUG_TITLE"
            [ "$VERDICT" = "CONCERNS" ] && [ -n "$reason" ] && [ "$reason" != "none found" ] && echo "**Judge's worry:** $reason"
            [ "$OUTCOME" = "best" ] && echo "**Still wrong:** $reason"
            if [ -n "$earlier" ]; then echo; echo "**Rejected on the way here:**"; echo "$earlier"; fi
            if [ -n "$parked" ]; then echo; echo "**Parked today (judge rejected every attempt):**"; echo "$parked"; fi
            true
          } > notify.md
          cat notify.md
          gh pr ready "$PR" --repo "$REPO"
          gh pr comment "$PR" --repo "$REPO" --body-file notify.md
          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$OWNER" >/dev/null 2>&1 || true

      # FAIL: revise the same PR with the judge's reasons, or park it and move to the next bug
      - name: Rejected, revise or move on
        if: steps.verdict.outputs.outcome == 'retry' || steps.verdict.outputs.outcome == 'park'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUG: ${{ env.BUG }}
        run: |
          if [ "${{ steps.verdict.outputs.outcome }}" = "retry" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "Attempt $((ATTEMPT + 1)) of $MAX_ATTEMPTS is starting: the fixer revises this PR with the reasons above, keeping what the judge said works."
            bash .github/ux-agent/next-round.sh retry
          else
            gh label create ux-parked --color 6e7781 --description "The judge rejected every attempt; left for later" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label ux-parked
            gh pr close "$PR" --repo "$REPO" --delete-branch \
              --comment "Parked after $MAX_ATTEMPTS attempts: the judge still rejects it and says merging it would make the app worse. The bug stays in the Daily UX report for another day. Moving on to the tester's next pick, if there is one."
            bash .github/ux-agent/next-round.sh next-bug
          fi

  # If any step breaks, tag Anya once on the report issue, so a stuck run doesn't go unnoticed
  alert:
    name: "Tell Anya if a run broke"
    needs: [test, gate, fix, judge]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: "Tester ${{ needs.test.result }}, fixer ${{ needs.fix.result }}, judge ${{ needs.judge.result }}"
        run: |
          issue=$(gh issue list --repo "$REPO" --label ux-report --state open --json number -q '.[0].number')
          [ -n "$issue" ] || exit 0
          gh issue comment "$issue" --repo "$REPO" --body "@$OWNER ⚠️ Today's check stopped with an error, so nothing more will happen until the next run or until you re-run it. $RESULTS. [Open the run]($RUN_URL) and look at the red step; its \"Why … stopped\" step says what the agent hit."
