<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rothar</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rothar">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e31837">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ─── Leaflet-style adapter over MapLibre GL (only the calls this app uses) ───
// Zoom levels are kept in Leaflet terms (MapLibre's 512px tiles sit one level lower).
window.L = (() => {
  const ML = maplibregl;
  const STYLE = 'https://tiles.openfreemap.org/styles/positron';
  const ll2 = ll => Array.isArray(ll) ? [ll[1], ll[0]] : [ll.lng ?? ll.lon, ll.lat];

  class Layer { addTo(t) { t.addLayer(this); return this; } _add() {} _remove() {} }

  class TileLayer extends Layer {}            // the style supplies the base map

  class DivIcon { constructor(o) { this.o = o || {}; } }

  class Marker extends Layer {
    constructor(ll, o = {}) { super(); this.ll = ll; this.o = o; this.html = null; this.rot = 0; }
    bindPopup(h) { this.html = h; if (this.m) this._popup(); return this; }
    _popup() { this.m.setPopup(new ML.Popup({ offset: 14, closeButton: false, maxWidth: '260px' }).setHTML(this.html)); }
    _add(map) {
      const i = this.o.icon?.o || {};
      const [w, h] = i.iconSize || [16, 16];
      const [ax, ay] = i.iconAnchor || [w / 2, h / 2];
      const el = document.createElement('div');
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.innerHTML = i.html || '';
      if (this.o.opacity != null) el.style.opacity = this.o.opacity;
      if (this.o.zIndexOffset) el.style.zIndex = String(this.o.zIndexOffset);
      this.el = el;
      this.m = new ML.Marker({ element: el, anchor: 'top-left', offset: [-ax, -ay],
                               rotationAlignment: this.o.rotationAlignment || 'viewport', pitchAlignment: 'viewport' })
        .setLngLat(ll2(this.ll)).setRotation(this.rot).addTo(map._ml);
      if (this.html) this._popup();
    }
    _remove() { this.m?.remove(); this.m = null; }
    setLatLng(ll) { this.ll = ll; this.m?.setLngLat(ll2(ll)); return this; }
    setRotation(d) { this.rot = d; this.m?.setRotation(d); return this; }
    getElement() { return this.el; }
  }

  let seq = 0;
  class Polyline extends Layer {
    constructor(lls, o = {}) { super(); this.lls = lls; this.o = o; this.id = 'line' + (++seq); }
    _add(map) {
      this.map = map; this.gone = false;
      map._whenStyle(() => {
        if (this.gone) return;
        const ml = map._ml, w = this.o.weight || 3;
        const paint = { 'line-color': this.o.color || '#3388ff', 'line-width': w, 'line-opacity': this.o.opacity ?? 1 };
        if (this.o.dashArray) paint['line-dasharray'] = String(this.o.dashArray).split(/[ ,]+/).map(x => Number(x) / w);
        ml.addSource(this.id, { type: 'geojson', data: { type: 'Feature', properties: {},
          geometry: { type: 'LineString', coordinates: this.lls.map(ll2) } } });
        ml.addLayer({ id: this.id, type: 'line', source: this.id,
          layout: { 'line-cap': this.o.lineCap || 'round', 'line-join': this.o.lineJoin || 'round' }, paint });
      });
    }
    _remove() {
      this.gone = true;
      const ml = this.map?._ml; if (!ml || !ml.style) return;
      if (ml.getLayer(this.id)) ml.removeLayer(this.id);
      if (ml.getSource(this.id)) ml.removeSource(this.id);
    }
  }

  class LayerGroup extends Layer {
    constructor() { super(); this.layers = new Set(); this.map = null; }
    addLayer(l) { this.layers.add(l); if (this.map) l._add(this.map); return this; }
    removeLayer(l) { if (this.layers.delete(l) && this.map) l._remove(); return this; }
    clearLayers() { if (this.map) this.layers.forEach(l => l._remove()); this.layers.clear(); return this; }
    getLayers() { return [...this.layers]; }
    _add(map) { this.map = map; this.layers.forEach(l => l._add(map)); }
    _remove() { this.layers.forEach(l => l._remove()); this.map = null; }
  }

  class Bounds { constructor(pts) { this.b = new ML.LngLatBounds(); (pts || []).forEach(p => this.b.extend(ll2(p))); } }

  class MapW {
    constructor(id, o = {}) {
      this._ml = new ML.Map({ container: id, style: STYLE, center: [-0.118, 51.506], zoom: 12,
                              attributionControl: { compact: true }, maxPitch: 70 });
      this._layers = new Set(); this._ready = false; this._q = [];
      this._ml.on('load', () => {
        // Soft 3D buildings: low and pale, under the street labels; route lines are added later so sit on top
        try {
          const firstLabel = this._ml.getStyle().layers.find(l => l.type === 'symbol')?.id;
          this._ml.addLayer({ id: 'building-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 14,
            paint: { 'fill-extrusion-color': '#e4e4e0', 'fill-extrusion-opacity': 0.4,
                     'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['*', 0.4, ['coalesce', ['get', 'render_height'], 8]]],
                     'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0] } }, firstLabel);
        } catch (e) { console.warn('3D buildings unavailable:', e.message); }
        // Warm, calm palette: tint what's there, red route stays the strongest colour
        const tint = { background: ['background-color', '#f6f4ef'], park: ['fill-color', '#dcebd2'],
          landcover_wood: ['fill-color', '#d3e6c8'], landuse_residential: ['fill-color', '#f1eee8'],
          water: ['fill-color', '#cfe2ef'], waterway: ['line-color', '#bcd7ea'], building: ['fill-color', '#ebe5db'],
          highway_major_inner: ['line-color', '#fff4d8'], highway_major_subtle: ['line-color', '#fff4d8'],
          highway_motorway_inner: ['line-color', '#ffe9b8'], highway_motorway_subtle: ['line-color', '#ffe9b8'],
          highway_minor: ['line-color', '#ffffff'] };
        Object.entries(tint).forEach(([id, [k, v]]) => { try { if (this._ml.getLayer(id)) this._ml.setPaintProperty(id, k, v); } catch (e) {} });
        try { this._ml.setPaintProperty('building-3d', 'fill-extrusion-color', '#e8e1d5');
              this._ml.setPaintProperty('building-3d', 'fill-extrusion-opacity', 0.55); } catch (e) {}
        this._ready = true; this._q.splice(0).forEach(f => f());
      });
      if (o.zoomControl !== false) this._ml.addControl(new ML.NavigationControl({ visualizePitch: true }), 'top-left');
    }
    _whenStyle(f) { this._ready ? f() : this._q.push(f); }
    addLayer(l) { this._layers.add(l); l._add(this); return this; }
    removeLayer(l) { this._layers.delete(l); l._remove(); return this; }
    eachLayer(fn) { this._layers.forEach(fn); }
    on(ev, fn) { this._ml.on(ev, fn); return this; }
    setView(ll, z, opt) {
      const o = { center: ll2(ll), zoom: z != null ? z - 1 : this._ml.getZoom() };
      opt?.animate ? this._ml.easeTo(o) : this._ml.jumpTo(o); return this;
    }
    panTo(ll, opt) { this._ml.easeTo({ center: ll2(ll), duration: (opt?.duration ?? 0.5) * 1000 }); return this; }
    fitBounds(b, opt) {
      const p = opt?.padding, pad = Array.isArray(p) ? { top: p[1], bottom: p[1], left: p[0], right: p[0] } : (p ?? 20);
      this._ml.fitBounds(b.b, { padding: pad, duration: 0, bearing: 0, pitch: 0, maxZoom: 16 });
      this._ml.setPitch(15);                                     // slight tilt on the overview
      return this;
    }
    getCenter() { const c = this._ml.getCenter(); return { lat: c.lat, lng: c.lng }; }
    getZoom() { return this._ml.getZoom() + 1; }
  }

  return {
    map: (id, o) => new MapW(id, o), tileLayer: () => new TileLayer(), TileLayer,
    layerGroup: () => new LayerGroup(), marker: (ll, o) => new Marker(ll, o), divIcon: o => new DivIcon(o),
    polyline: (lls, o) => new Polyline(lls, o), latLngBounds: pts => new Bounds(pts),
  };
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f4f0; overflow: hidden; }

/* ── Header ── */

#refresh-btn.spinning #refresh-icon { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Search panel ── */
#search-panel { background: white; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; display: flex; flex-direction: column; gap: 7px; }
#search-panel.nav-active { display: none; }

.search-input { width: 100%; padding: 9px 28px 9px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; background: white; color: #111; transition: border-color 0.15s; }
.search-input:focus { border-color: #e31837; }
.clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; display: none; line-height: 1; padding: 0; }
.clear-btn.visible { display: block; }
.loc-btn { background: white; color: #e31837; border: 1.5px solid #e31837; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0; font-weight: 500; }
#filter-row, #route-row { display: flex; gap: 6px; }
.pill-btn { flex: 1; padding: 6px 4px; border: 1.5px solid #ddd; border-radius: 20px; background: white; font-size: 11px; cursor: pointer; color: #777; white-space: nowrap; font-family: inherit; text-align: center; transition: all 0.15s; }
.pill-btn.active-red  { background: #e31837; border-color: #e31837; color: white; font-weight: 600; }
.pill-btn.active-blue { background: #2563eb; border-color: #2563eb; color: white; font-weight: 600; }
.pill-btn:hover:not(.active-red):not(.active-blue) { border-color: #999; color: #333; }

/* ── Autocomplete ── */
.autocomplete-list { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 8px; z-index: 3000; box-shadow: 0 6px 16px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto; display: none; }
.ac-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f5f5f5; display: flex; align-items: flex-start; gap: 8px; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover { background: #fef2f2; }
.ac-main { font-size: 13px; color: #111; }
.ac-sub  { font-size: 11px; color: #888; margin-top: 1px; }

/* ── Map ── */
#map-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
#map { height: 100%; width: 100%; }
#toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 2000; display: none; white-space: nowrap; pointer-events: none; max-width: 90%; text-align: center; }
.map-legend { position: absolute; bottom: 10px; left: 10px; background: white; border-radius: 8px; padding: 8px 10px; font-size: 11px; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #444; line-height: 1.8; }
.leg-row { display: flex; align-items: center; gap: 5px; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── GPS pulsing pin ── */
.gps-outer { width: 24px; height: 24px; position: relative; display: flex; align-items: center; justify-content: center; }
.gps-inner { width: 13px; height: 13px; background: #1d4ed8; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 2px 6px rgba(29,78,216,0.5); position: relative; z-index: 1; }
.gps-ring  { position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; background: rgba(29,78,216,0.22); animation: gps-pulse 2s ease-out infinite; }
@keyframes gps-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

/* ── Nav overlay ── */
#nav-overlay { position: absolute; top: 0; left: 0; right: 0; z-index: 1500; display: none; flex-direction: column; pointer-events: none; }
#nav-overlay.active { display: flex; }
#nav-card { color: white; padding: 14px 16px 10px; pointer-events: auto; transition: background 0.4s; }
#nav-card.walk    { background: #1e1b4b; }
#nav-card.cycle   { background: #7f1d1d; }
#nav-card.pickup  { background: #14532d; }
#nav-card.dropoff { background: #4a1d96; }
#nav-top { display: flex; align-items: center; gap: 12px; }
#nav-maneuver { font-size: 36px; flex-shrink: 0; width: 44px; text-align: center; line-height: 1; }
#nav-text { flex: 1; min-width: 0; }
#nav-primary { font-size: 17px; font-weight: 700; line-height: 1.2; }
#nav-road    { font-size: 12px; opacity: 0.75; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nav-dist    { font-size: 26px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
#nav-bar { height: 3px; background: rgba(255,255,255,0.2); margin-top: 10px; border-radius: 2px; }
#nav-bar-fill { height: 100%; background: white; border-radius: 2px; transition: width 0.5s; }
#nav-meta { background: rgba(0,0,0,0.6); padding: 7px 14px; display: flex; align-items: center; justify-content: space-between; pointer-events: auto; }
#nav-step-label { font-size: 11px; color: rgba(255,255,255,0.7); }
#nav-eta-label  { font-size: 11px; color: rgba(255,255,255,0.7); }
#nav-view { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; margin-left: auto; margin-right: 6px; }
#nav-facing { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1550; display: none; padding: 9px 16px; border-radius: 22px; font-size: 15px; font-weight: 700; color: white; box-shadow: 0 4px 14px rgba(0,0,0,0.25); pointer-events: none; }
#nav-facing.ok { background: #16a34a; } #nav-facing.warn { background: #d97706; } #nav-facing.bad { background: #dc2626; }
#nav-stop { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

/* ── Walk suggestion banner ── */
#walk-banner { display: none; background: #f0fdf4; border-top: 2px solid #16a34a; padding: 12px 16px; flex-shrink: 0; align-items: center; gap: 10px; }
#walk-banner.visible { display: flex; }
#walk-banner p { flex: 1; font-size: 13px; color: #14532d; line-height: 1.4; }
#walk-anyway-btn { background: white; border: 1.5px solid #16a34a; color: #166534; border-radius: 8px; padding: 7px 11px; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: inherit; font-weight: 500; }

/* ── Availability popup ── */
#avail-popup { position: absolute; bottom: 16px; left: 12px; right: 12px; background: white; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); z-index: 1600; display: none; overflow: hidden; pointer-events: auto; }
#avail-popup.visible { display: block; }
#avail-popup-head { padding: 12px 14px 8px; background: #fffbeb; border-bottom: 1px solid #fde68a; display: flex; align-items: center; gap: 8px; }
#avail-popup-title { font-size: 14px; font-weight: 600; color: #78350f; flex: 1; }
#avail-popup-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #92400e; line-height: 1; }
#avail-popup-body { padding: 10px 14px 4px; font-size: 13px; color: #374151; line-height: 1.5; }
#avail-popup-likelihood { padding: 6px 14px 10px; font-size: 12px; font-weight: 500; }
#avail-popup-actions { display: flex; gap: 8px; padding: 0 14px 14px; }
.avail-act { flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
#avail-wait   { background: #f3f4f6; color: #111; }
#avail-reroute { background: #e31837; color: white; }

/* ── Activity panel ── */
#history-btn { background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.4); color: white; border-radius: 8px; height: 34px; padding: 0 10px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
#history-panel { position: fixed; inset: 0; background: #f5f4f0; z-index: 5000; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
#history-panel.visible { display: flex; }
#history-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: white; border-bottom: 1px solid #e5e5e5; }
#history-head h2 { font-size: 15px; font-weight: 600; }
#history-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #666; line-height: 1; }
#history-totals { display: flex; gap: 8px; padding: 12px 14px 4px; }
.hist-total { flex: 1; background: white; border-radius: 10px; padding: 10px 12px; }
.hist-total b { display: block; font-size: 18px; color: #e31837; }
.hist-total span { font-size: 11px; color: #777; }
#history-list { flex: 1; overflow-y: auto; padding: 8px 14px 16px; }
.hist-item { background: white; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: #222; }
.hist-route { font-weight: 600; }
.hist-meta { font-size: 11px; color: #777; margin-top: 3px; line-height: 1.5; }
.hist-empty { font-size: 13px; color: #777; text-align: center; padding: 30px 10px; line-height: 1.5; }
.hist-note { font-size: 11px; color: #999; padding: 0 14px 12px; }

/* ── Start button + journey panel ── */
#start-nav-btn { display: none; width: calc(100% - 28px); margin: 10px 14px; padding: 12px; background: #e31837; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
#start-nav-btn.visible { display: block; }
#journey-panel { background: white; border-top: 2px solid #e31837; max-height: 210px; overflow-y: auto; flex-shrink: 0; display: none; }
#journey-panel.visible { display: block; }
#journey-panel.nav-active { display: none; }
#journey-summary { padding: 10px 14px; background: #fef2f2; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #fecaca; position: sticky; top: 0; }
.sum-chip { font-size: 12px; background: white; border-radius: 6px; padding: 3px 8px; color: #374151; border: 1px solid #f0c0c0; white-space: nowrap; }
.sum-chip strong { color: #e31837; }
#steps-list { padding: 4px 0 8px; }
.step-header { padding: 8px 14px 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #e31837; display: flex; align-items: center; gap: 6px; }
.step-header-line { flex: 1; height: 1px; background: #fecaca; }
.step-row { display: flex; gap: 10px; padding: 4px 14px; font-size: 13px; color: #333; align-items: baseline; }
.step-ic { width: 18px; text-align: center; flex-shrink: 0; }
.step-txt { flex: 1; line-height: 1.45; }
.step-d { font-size: 11px; color: #999; white-space: nowrap; }
.avail-row { display: flex; gap: 5px; padding: 3px 14px 5px; flex-wrap: wrap; }
.avail-chip { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
.chip-std   { background: #dcfce7; color: #166534; }
.chip-ebike { background: #dbeafe; color: #1e40af; }
.chip-none  { background: #fee2e2; color: #991b1b; }
.leaflet-popup-content { margin: 8px 10px; }
.popup-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.popup-avail { display: flex; gap: 4px; flex-wrap: wrap; }
.p-chip { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 500; }
.route-alt-ring { width:22px;height:22px;border-radius:50%;border:3px solid #f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;background:white; }
</style>

<div id="header">
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 0 0-1-1h-4l-3 7h10l-2-6z"/><path d="M5.5 14 9 6"/></svg>
    Rothar
  </h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="refresh-badge">Loading…</span>
    <button id="history-btn">Activity</button>
    <button id="refresh-btn">
      <svg id="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="search-panel">
  <div class="input-row">
