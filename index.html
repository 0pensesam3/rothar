<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const TFL        = 'https://api.tfl.gov.uk';
const OSRM_FOOT  = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot';
const OSRM_BIKE  = 'https://routing.openstreetmap.de/routed-bike/route/v1/bike';
const VALHALLA   = 'https://valhalla1.openstreetmap.de/route';
const NOMINATIM  = 'https://nominatim.openstreetmap.org';

const STATION_RADIUS = 800;   // m — only render stations within this range when journey is set
const WALK_ONLY_DIST = 750;   // m — recommend walking if destination this close
const MIN_BIKE_SAVING = 60;   // s — only recommend walking if bike saves less than this
const LOW_AVAIL      = 2;     // bikes/docks threshold for availability alerts
const STEP_ADV_M     = 30;    // m — auto-advance nav step within this distance of maneuver
const WALK_SPD       = 80;    // m/min (for station selection estimates only)
const CYCLE_SPD      = 220;   // m/min
const DOCK_OVERHEAD  = 90;    // s — releasing a bike at the dock plus docking it at the end
const DETOUR         = 1.3;   // straight-line → street distance, for estimates only
const PROXIMITY_SECS = 300;   // s — start watching a station when this close to it
const PROXIMITY_EVERY = 15;   // s — how often to re-check it in that window

// ─── State ────────────────────────────────────────────────────────────────────
const S = {
  stations: [], start: null, end: null,
  pickup: null, dropoff: null,
  walkIn: null, cycle: null, walkOut: null,
  lastRefresh: null, journeyActive: false,
  bikeFilter: 'any', routeType: 'balanced',
  startIsGPS: false,
  forceShowBike: false,  // set when user clicks "Bike anyway"
};

const NAV = {
  active: false, steps: [], current: 0,
  watchId: null, proximityRefreshId: null,
  userMarker: null,
};

// Pending availability alert
let pendingAlert = null;

// ─── Map — MapLibre with OpenFreeMap's grey Positron style (no key) ──────────
const map = L.map('map', {zoomControl: true}).setView([51.506, -0.118], 13);

const stationLayer  = L.layerGroup().addTo(map);
const routeLayer    = L.layerGroup().addTo(map);
const navAltLayer   = L.layerGroup().addTo(map); // alt stations shown during navigation
let markerStart = null, markerEnd = null, markerPickup = null, markerDropoff = null;

// ─── Utilities ────────────────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (lat2-lat1)*r, dLo = (lon2-lon1)*r;
  const a = Math.sin(dLa/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`; }
function fmtTime(s) {
  const m = Math.round(s/60);
  return m < 1 ? '< 1 min' : m < 60 ? `${m} min` : `${Math.floor(m/60)}h ${m%60}m`;
}
function prop(station, key) {
  const p = (station.additionalProperties||[]).find(x => x.key === key);
  return p ? (parseInt(p.value)||0) : 0;
}

let toastTimer;
function toast(msg, dur=3000) {
  const el = document.getElementById('toast');
  clearTimeout(toastTimer);
  if (!msg) { el.style.display='none'; return; }
  el.textContent = msg; el.style.display = 'block';
  if (dur > 0) toastTimer = setTimeout(() => el.style.display = 'none', dur);
}

// ─── Station loading ──────────────────────────────────────────────────────────
async function loadStations(fromButton=false) {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  try {
    const res = await fetch(`${TFL}/BikePoint/`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    S.stations = await res.json();
    S.lastRefresh = Date.now();
    renderStations();
    updateBadge();
    if (fromButton) toast('');
    if (NAV.active) syncJourneyStations();
    else if (S.start && S.end) planJourney(true);
  } catch(e) {
    toast(`⚠ Station data error: ${e.message}`, 6000);
  } finally {
    btn.classList.remove('spinning');
  }
}

function updateBadge() {
  const el = document.getElementById('refresh-badge');
  if (!S.lastRefresh) { el.textContent = 'Loading…'; return; }
  const age = Math.round((Date.now()-S.lastRefresh)/1000);
  const str = age < 10 ? 'just now' : age < 60 ? `${age}s ago` : `${Math.floor(age/60)}m ago`;
  el.textContent = `${S.stations.length} · ${str}`;
}

// ─── Station rendering + filtering ───────────────────────────────────────────
function matchesFilter(s, filter) {
  const bikes = prop(s,'NbBikes'), ebikes = prop(s,'NbEBikes');
  if (filter === 'standard') return (bikes-ebikes) > 0;
  if (filter === 'ebike')    return ebikes > 0;
  return bikes > 0;
}

// Only show stations near start/end — reduces visual clutter dramatically
function isStationVisible(s) {
  if (!S.start && !S.end) {               // exploration mode: stations around the map centre
    const c = map.getCenter();
    return haversine(c.lat, c.lng, s.lat, s.lon) < 2000;
  }
  const nearStart = S.start ? haversine(S.start.lat, S.start.lon, s.lat, s.lon) < STATION_RADIUS : false;
  const nearEnd   = S.end   ? haversine(S.end.lat,   S.end.lon,   s.lat, s.lon) < STATION_RADIUS : false;
  return nearStart || nearEnd;
}

function stationColor(bikes, ebikes) {
  if (bikes === 0) return '#dc2626';
  if (bikes <= 2)  return '#d97706';
  if (bikes-ebikes === 0) return '#2563eb';
  return '#16a34a';
}

function makeStationIcon(bikes, ebikes, sz=16) {
  const col = stationColor(bikes, ebikes);
  const hasE = ebikes > 0 && bikes > 0;
  const lbl = bikes === 0 ? '' : bikes <= 9 ? String(bikes) : '9+';
  const eTag = hasE ? `<span style="position:absolute;top:-5px;right:-6px;background:#1d4ed8;color:white;font-size:7px;font-weight:700;padding:0 2px;border-radius:3px;border:1px solid white;line-height:1.4">E</span>` : '';
  return L.divIcon({
    className: '',
    html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*0.55)}px;font-weight:700;color:white;position:relative;">${lbl}${eTag}</div>`,
    iconSize: [sz,sz], iconAnchor: [sz/2,sz/2]
  });
}

function makeNavPinIcon(emoji, color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:14px;">${emoji}</div>`,
    iconSize: [28,28], iconAnchor: [14,14]
  });
}

// GPS pulsing blue dot — distinct from typed address pin
// Amber-ringed alternative station icon shown during navigation
function makeAltStationIcon(bikes, ebikes) {
  const col = stationColor(bikes, ebikes);
  const lbl = bikes === 0 ? '' : bikes <= 9 ? String(bikes) : '9+';
  return L.divIcon({
    className: '',
    html: `<div class="route-alt-ring"><div style="width:14px;height:14px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:white;">${lbl}</div></div>`,
    iconSize: [22,22], iconAnchor: [11,11]
  });
}

const RIDER_HTML = `<div style="position:relative;width:46px;height:58px;">
  <div style="position:absolute;left:9px;bottom:0;width:28px;height:9px;border-radius:50%;background:rgba(0,0,0,0.28);filter:blur(2px);"></div>
  <img src="rider.png" alt="" style="position:absolute;left:0;top:6px;width:46px;height:40px;filter:drop-shadow(0 0 1.5px white) drop-shadow(0 0 1.5px white) drop-shadow(0 3px 3px rgba(0,0,0,0.25));"/>
</div>`;
function makeRiderIcon() { return L.divIcon({ className: '', html: RIDER_HTML, iconSize: [46,58], iconAnchor: [23,58] }); }

// ─── 3D rider (three.js inside MapLibre), shown in the navigation follow view ─
const THREE_URL = 'https://unpkg.com/three@0.160.0/build/three.min.js';
const RIDER_METRES = 22;          // model height on the map; larger than life so you can see her
let threeLoading = null;
function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  return threeLoading ||= new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = THREE_URL;
    s.onload = () => ok(window.THREE); s.onerror = () => bad(new Error('three.js failed to load'));
    document.head.appendChild(s);
  });
}

// Built from simple shapes after the logo: Y is up, she rides towards +X, 1 unit ≈ wheel-to-wheel
function buildRiderModel(THREE) {
  const red = new THREE.MeshStandardMaterial({ color: 0xe31837, roughness: 0.55, metalness: 0.05 });
  const dark = new THREE.MeshStandardMaterial({ color: 0xa30f26, roughness: 0.6 });
  const g = new THREE.Group();
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
  const rod = (a, b, r, mat = red) => {
    const len = a.distanceTo(b), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
    g.add(m); return m;
  };
  const ball = (p, r, mat = red) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat); m.position.copy(p); g.add(m); return m; };
  // wheels
  [-0.42, 0.42].forEach(x => { const w = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.045, 10, 36), dark); w.position.set(x, 0.3, 0); g.add(w);
                               ball(V(x, 0.3, 0), 0.04, dark); });
  // frame
  const rear = V(-0.42, 0.3), bb = V(0.02, 0.3), seat = V(-0.12, 0.7), head = V(0.3, 0.72), front = V(0.42, 0.3);
  rod(rear, bb, 0.03); rod(rear, seat, 0.03); rod(bb, seat, 0.035); rod(seat, head, 0.035); rod(bb, head, 0.035); rod(head, front, 0.03);
  rod(head, V(0.27, 0.86), 0.025); rod(V(0.27, 0.86, -0.12), V(0.27, 0.86, 0.12), 0.022);       // stem + handlebar
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.035, 0.08), dark); saddle.position.set(-0.14, 0.74, 0); g.add(saddle);
  // rider
  const hip = V(-0.1, 0.8), shoulder = V(0.06, 1.2), neck = V(0.08, 1.27);
  rod(hip, shoulder, 0.085); ball(hip, 0.085); ball(shoulder, 0.08);
  ball(V(0.11, 1.38), 0.11);                                                                       // head
  rod(V(0.02, 1.46), V(-0.1, 1.44), 0.035); ball(V(-0.14, 1.4), 0.05);                              // ponytail
  rod(neck, V(0.08, 1.31), 0.04);
  [-0.08, 0.08].forEach((z, i) => {
    const sh = V(0.06, 1.18, z), hand = V(0.27, 0.87, z * 1.4);
    rod(sh, hand, 0.035); ball(hand, 0.04);                                                         // arms
    const hp = V(-0.1, 0.8, z), knee = i ? V(0.14, 0.62, z) : V(0.08, 0.52, z), foot = i ? V(0.06, 0.36, z) : V(-0.02, 0.22, z);
    rod(hp, knee, 0.055); ball(knee, 0.055); rod(knee, foot, 0.045); ball(foot, 0.045);               // legs, pedalling
  });
  // soft shadow on the ground
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.6, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 }));
  sh.rotation.x = -Math.PI / 2; sh.scale.set(1.3, 0.5, 1); sh.position.y = 0.005; g.add(sh);
  g.position.x = 0;                       // centred on the bottom bracket, roughly her middle
  return g;
}

function makeRiderLayer(THREE) {
  return {
    id: 'rider-3d', type: 'custom', renderingMode: '3d', pos: null, heading: 0, visible: true,
    onAdd(m, gl) {
      this.map = m; this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
      this.scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(0.6, 1.5, 0.8); this.scene.add(sun);
      this.model = buildRiderModel(THREE); this.scene.add(this.model);
      this.renderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
      this.renderer.autoClear = false;
    },
    render(gl, matrix) {
      if (!this.pos || !this.visible) return;
      const mc = maplibregl.MercatorCoordinate.fromLngLat(this.pos, 0);
      const s = mc.meterInMercatorCoordinateUnits() * RIDER_METRES;
      const rx = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
      const ry = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 1, 0), (this.heading - 90) * Math.PI / 180);
      const l = new THREE.Matrix4().makeTranslation(mc.x, mc.y, mc.z).scale(new THREE.Vector3(s, -s, s)).multiply(rx).multiply(ry);
      this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(l);
      this.renderer.resetState();
      this.renderer.render(this.scene, this.camera);
    }
  };
}

// Which way she points: your heading if known, else the direction of the route ahead
function riderHeading() {
  if (NAV.heading != null) return NAV.heading;
  const a = NAV.userLat !== undefined && aheadPoint(NAV.userLat, NAV.userLon);
  return a ? bearingTo(NAV.userLat, NAV.userLon, a.lat, a.lon) : 0;
}

function syncRider() {
  const L3 = NAV.rider3d; if (!L3 || NAV.userLat === undefined) return;
  L3.pos = [NAV.userLon, NAV.userLat]; L3.heading = riderHeading();
  L3.visible = NAV.view === 'follow';
  const el = NAV.riderMarker?.getElement(); if (el) el.style.visibility = L3.visible ? 'hidden' : 'visible';
  map._ml.triggerRepaint();
}

async function startRider3d() {
  try {
    const THREE = await loadThree();
    if (!NAV.active || NAV.rider3d) return;
    map._whenStyle(() => {
      if (!NAV.active || map._ml.getLayer('rider-3d')) return;
      NAV.rider3d = makeRiderLayer(THREE);
      map._ml.addLayer(NAV.rider3d);
      syncRider();
    });
  } catch (e) { console.warn(e.message); }      // flat rider stays as the fallback
}
function stopRider3d() {
  try { if (map._ml.getLayer('rider-3d')) map._ml.removeLayer('rider-3d'); } catch (e) {}
  NAV.rider3d = null;
}

// Your GPS location on the planning screen: the rider too
function makeGPSIcon() { return makeRiderIcon(); }

// Typed start address — red pin
function makeTypedStartIcon() {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:#e31837;border:3px solid white;box-shadow:0 2px 6px rgba(227,24,55,0.4)"></div>`,
    iconSize: [14,14], iconAnchor: [7,7]
  });
}

function availabilityHTML(station) {
  const bikes = prop(station,'NbBikes'), ebikes = prop(station,'NbEBikes');
  const std = bikes-ebikes, empty = prop(station,'NbEmptyDocks');
  const p = [];
  if (std > 0)     p.push(`<span class="p-chip" style="background:#dcfce7;color:#166534;">🚲 ${std}</span>`);
  if (ebikes > 0)  p.push(`<span class="p-chip" style="background:#dbeafe;color:#1e40af;">⚡ ${ebikes}</span>`);
  if (bikes === 0) p.push(`<span class="p-chip" style="background:#fee2e2;color:#991b1b;">No bikes</span>`);
  p.push(`<span class="p-chip" style="background:#f3f4f6;color:#374151;">🅿 ${empty}</span>`);
  return p.join('');
}

function renderStations() {
  stationLayer.clearLayers();
  if (NAV.active) return; // nav view: only pickup, dropoff and amber alternatives
  S.stations.forEach(s => {
    if (!isStationVisible(s)) return; // ← hide irrelevant stations
    const bikes = prop(s,'NbBikes'), ebikes = prop(s,'NbEBikes');
    const opacity = matchesFilter(s, S.bikeFilter) ? 1 : 0.15;
    L.marker([s.lat,s.lon], {icon: makeStationIcon(bikes,ebikes), opacity})
      .bindPopup(`<div class="popup-name">${s.commonName}</div><div class="popup-avail">${availabilityHTML(s)}</div>`)
      .addTo(stationLayer);
  });
}

// ─── Station selection (total-time optimised) ─────────────────────────────────
function bestPickup(sLat, sLon, dLat, dLon, excludeId, minCount=1) {
  let best = null, bt = Infinity;
  S.stations.forEach(s => {
    if (s.id === excludeId) return;
    if (!matchesFilter(s, S.bikeFilter)) return;
    if (usableBikes(s) < minCount) return;
    const t = haversine(sLat,sLon,s.lat,s.lon)/WALK_SPD + haversine(s.lat,s.lon,dLat,dLon)/CYCLE_SPD;
    if (t < bt) { bt = t; best = s; }
  });
  return { station: best, dist: best ? haversine(sLat,sLon,best.lat,best.lon) : 0 };
}

function bestDropoff(pLat, pLon, eLat, eLon, excludeId, minCount=1) {
  let best = null, bt = Infinity;
  S.stations.forEach(s => {
    if (s.id === excludeId) return;
    if (prop(s,'NbEmptyDocks') < minCount) return;
    const t = haversine(pLat,pLon,s.lat,s.lon)/CYCLE_SPD + haversine(s.lat,s.lon,eLat,eLon)/WALK_SPD;
    if (t < bt) { bt = t; best = s; }
  });
  return { station: best, dist: best ? haversine(best.lat,best.lon,eLat,eLon) : 0 };
}

// ─── Routing — Valhalla for cycling (3 modes), TfL Journey API for walking ───

function decodePolyline6(str) {
  // Valhalla uses precision-6 encoded polyline
  const factor = 1e6;
  let lat = 0, lng = 0, idx = 0;
  const coords = [];
  while (idx < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(idx++)-63; result |= (b&0x1f)<<shift; shift += 5; } while (b >= 0x20);
    lat += result&1 ? ~(result>>1) : result>>1;
    shift = result = 0;
    do { b = str.charCodeAt(idx++)-63; result |= (b&0x1f)<<shift; shift += 5; } while (b >= 0x20);
    lng += result&1 ? ~(result>>1) : result>>1;
    coords.push([lng/factor, lat/factor]); // [lon,lat]
  }
  return coords;
}

function valhallaManeuverToStep(m, coords) {
  const loc = coords[m.begin_shape_index] || coords[0];
  // Map Valhalla type numbers to readable text via the instruction field
  return {
    maneuver: { type: valhallaType(m.type), modifier: valhallaModifier(m.type), location: loc },
    name: (m.street_names||[]).join(', ')||'',
    distance: Math.round((m.length||0)*1000),
    duration: m.time||0,
    _instruction: m.instruction || ''
  };
}

function valhallaType(t) {
  if ([1,2,3].includes(t)) return 'depart';
  if ([4,5,6].includes(t)) return 'arrive';
  if (t === 8) return 'continue';
  if ([9,10,11,17,18,22,23].includes(t)) return 'turn'; // right variants
  if ([13,14,15,16,19,24].includes(t)) return 'turn'; // left variants
  if ([25,37,38].includes(t)) return 'merge';
  if ([26,27].includes(t)) return 'roundabout';
  return 'continue';
}

function valhallaModifier(t) {
  if ([2,9,17,23].includes(t)) return 'right';
  if ([3,16,19,24].includes(t)) return 'left';
  if ([11].includes(t)) return 'sharp right';
  if ([14].includes(t)) return 'sharp left';
  if ([10,18].includes(t)) return 'slight right';
  if ([15].includes(t)) return 'slight left';
  return '';
}

async function fetchCycleRoute(la1, lo1, la2, lo2) {
  // use_roads: 0.9=fastest (roads), 0.5=balanced, 0.1=quietest (paths/lanes)
  const useRoads = S.routeType === 'fastest' ? 0.9 : S.routeType === 'quietest' ? 0.0 : 0.5;
  try {
    const res = await fetch(VALHALLA + '?json=' + encodeURIComponent(JSON.stringify({
        locations: [{lon:lo1,lat:la1},{lon:lo2,lat:la2}],
        costing: 'bicycle',
        costing_options: { bicycle: { use_roads: useRoads, bicycle_type: 'City', use_hills: 0.3 } },
        directions_options: { language: 'en-GB', units: 'kilometers' }
      })));
    if (!res.ok) throw new Error(`Valhalla ${res.status}`);
    const data = await res.json();
    const trip = data.trip;
    const allCoords = [], steps = [];
    trip.legs.forEach(leg => {
      const coords = decodePolyline6(leg.shape);
      allCoords.push(...coords);
      leg.maneuvers.forEach(m => steps.push(valhallaManeuverToStep(m, coords)));
    });
    return {
      duration: trip.summary.time,
      distance: Math.round(trip.summary.length * 1000),
      geometry: { coordinates: allCoords },
      legs: [{ steps }]
    };
  } catch(e) {
    console.warn('Valhalla fallback to OSRM:', e.message);
    return fetchOSRMRoute(la1, lo1, la2, lo2, 'cycling');
  }
}

async function fetchWalkRoute(la1, lo1, la2, lo2) {
  // Valhalla pedestrian — much better London footpath/park/shortcut knowledge than OSRM foot
  try {
    const res = await fetch(VALHALLA + '?json=' + encodeURIComponent(JSON.stringify({
        locations: [{lon:lo1,lat:la1},{lon:lo2,lat:la2}],
        costing: 'pedestrian',
        costing_options: { pedestrian: { walking_speed: 4.5, use_ferry: 0 } },
        directions_options: { language: 'en-GB', units: 'kilometers' }
      })));
    if (!res.ok) throw new Error(`Valhalla pedestrian ${res.status}`);
    const data = await res.json();
    const trip = data.trip;
    const allCoords = [], steps = [];
    trip.legs.forEach(leg => {
      const coords = decodePolyline6(leg.shape);
      allCoords.push(...coords);
      leg.maneuvers.forEach(m => steps.push(valhallaManeuverToStep(m, coords)));
    });
    return {
      duration: trip.summary.time,
      distance: Math.round(trip.summary.length * 1000),
      geometry: { coordinates: allCoords },
      legs: [{ steps }]
    };
  } catch(e) {
    console.warn('Valhalla pedestrian fallback to OSRM:', e.message);
    return fetchOSRMRoute(la1, lo1, la2, lo2, 'foot');
  }
}

async function fetchOSRMRoute(la1, lo1, la2, lo2, profile) {
  const base = profile === 'foot' ? OSRM_FOOT : OSRM_BIKE;
  const url = `${base}/${lo1},${la1};${lo2},${la2}?overview=full&steps=true&geometries=geojson`;
  const res  = await fetch(url);
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes.length) throw new Error('No route');
  return data.routes[0];
}

function drawLine(coords, color, dashed) {
  if (!coords || !coords.length) return;
  L.polyline(coords.map(c=>[c[1],c[0]]), {
    color, weight: dashed?3:4.5, dashArray: dashed?'10,7':null, opacity: 0.9, lineCap:'round', lineJoin:'round'
  }).addTo(routeLayer);
}

// ─── Walk vs bike ─────────────────────────────────────────────────────────────
// Estimate only (straight-line × DETOUR). The real check, using routed times,
// runs again in planJourney once the routes come back.
function walkIsFaster(pickup, dropoff) {
  const direct  = haversine(S.start.lat, S.start.lon, S.end.lat, S.end.lon);
  const walkSecs = direct * DETOUR / WALK_SPD * 60;
  const bikeSecs = ( haversine(S.start.lat, S.start.lon, pickup.lat, pickup.lon) * DETOUR / WALK_SPD
                   + haversine(pickup.lat, pickup.lon, dropoff.lat, dropoff.lon) * DETOUR / CYCLE_SPD
                   + haversine(dropoff.lat, dropoff.lon, S.end.lat, S.end.lon) * DETOUR / WALK_SPD ) * 60
                   + DOCK_OVERHEAD;
  // Walk unless the bike saves at least MIN_BIKE_SAVING
  return { yes: walkSecs - bikeSecs < MIN_BIKE_SAVING, dist: direct, walkSecs, bikeSecs };
}

function showWalkBanner(dist, secs) {
  document.getElementById('walk-banner-text').textContent =
    `🚶 ${fmtDist(dist)} on foot, about ${fmtTime(secs)}. The bike wouldn't save you a minute.`;
  document.getElementById('walk-banner').classList.add('visible');
  document.getElementById('journey-panel').classList.remove('visible');
  document.getElementById('start-nav-btn').classList.remove('visible');
  // Clear any route lines and station pins from a bike plan
  routeLayer.clearLayers();
  [markerPickup,markerDropoff].forEach(m => m && map.removeLayer(m));
}

// Fetch and draw the direct walking route, then show the banner
async function showWalkOption(estSecs) {
  const dist = haversine(S.start.lat, S.start.lon, S.end.lat, S.end.lon);
  let walk = null;
  try { walk = await fetchWalkRoute(S.start.lat, S.start.lon, S.end.lat, S.end.lon); } catch(e) {}
  showWalkBanner(walk ? walk.distance : dist, walk ? walk.duration : estSecs);
  if (walk) drawLine(walk.geometry.coordinates, '#16a34a', true);
  S.walkIn = S.cycle = S.walkOut = null;
  map.fitBounds(L.latLngBounds([[S.start.lat,S.start.lon],[S.end.lat,S.end.lon]]), {padding:[60,60]});
  toast('');
}

function hideWalkBanner() {
  document.getElementById('walk-banner').classList.remove('visible');
}

// ─── Plan journey ─────────────────────────────────────────────────────────────
async function planJourney(silent=false) {
  if (!S.start || !S.end || !S.stations.length) return;

  if (!silent) toast('Planning your journey…', 0);
  routeLayer.clearLayers();
  [markerPickup,markerDropoff].forEach(m => m && map.removeLayer(m));

  // Seed dropoff, then optimise both stations
  const seedDrop = S.stations.reduce((b,s) => {
    if (prop(s,'NbEmptyDocks')===0) return b;
    const d = haversine(S.end.lat,S.end.lon,s.lat,s.lon);
    return (!b||d<b.d)?{s,d}:b;
  }, null)?.s;
  if (!seedDrop) { toast('⚠ No docking spaces near destination.',4000); return; }

  const {station:pickup, dist:wiDist} = bestPickup(S.start.lat,S.start.lon, seedDrop.lat,seedDrop.lon);
  if (!pickup) { toast(`⚠ No ${S.bikeFilter==='any'?'':S.bikeFilter+' '}bikes nearby.`,4000); return; }

  const {station:dropoff, dist:woDist} = bestDropoff(pickup.lat,pickup.lon, S.end.lat,S.end.lon);
  if (!dropoff) { toast('⚠ No docking spaces near destination.',4000); return; }

  // Walk vs bike, first pass (estimate). Skipped after "Bike anyway".
  hideWalkBanner();
  const forced = S.forceShowBike;
  const est = walkIsFaster(pickup, dropoff);
  if (!forced && est.yes) { await showWalkOption(est.walkSecs); return; }

  S.pickup = pickup; S.dropoff = dropoff; S.journeyActive = true;

  markerPickup  = L.marker([pickup.lat,pickup.lon],   {icon:makeNavPinIcon('🚲','#16a34a'),zIndexOffset:500}).addTo(map).bindPopup(`<div class="popup-name">Pick up here</div><div class="popup-avail">${availabilityHTML(pickup)}</div>`);
  markerDropoff = L.marker([dropoff.lat,dropoff.lon], {icon:makeNavPinIcon('🅿','#7c3aed'), zIndexOffset:500}).addTo(map).bindPopup(`<div class="popup-name">Return here</div><div class="popup-avail">${availabilityHTML(dropoff)}</div>`);

  let walkIn, cycle, walkOut;
  const [wiRes, cyRes, woRes, dwRes] = await Promise.allSettled([
    fetchWalkRoute(S.start.lat,S.start.lon, pickup.lat,pickup.lon),
    fetchCycleRoute(pickup.lat,pickup.lon,  dropoff.lat,dropoff.lon),
    fetchWalkRoute(dropoff.lat,dropoff.lon,  S.end.lat,S.end.lon),
    forced ? Promise.resolve(null) : fetchWalkRoute(S.start.lat,S.start.lon, S.end.lat,S.end.lon),
  ]);
  walkIn  = wiRes.status === 'fulfilled' ? wiRes.value : null;
  cycle   = cyRes.status === 'fulfilled' ? cyRes.value : null;
  walkOut = woRes.status === 'fulfilled' ? woRes.value : null;
  if (!walkIn || !walkOut) toast('Walking route unavailable — distances estimated.',3000);
  if (!cycle)  toast('Cycling route unavailable — distance estimated.',3000);

  // Walk vs bike, second pass (real routed times, including dock time)
  const directWalk = dwRes.status === 'fulfilled' ? dwRes.value : null;
  if (!forced && directWalk && walkIn && cycle && walkOut) {
    const bikeSecs = walkIn.duration + cycle.duration + walkOut.duration + DOCK_OVERHEAD;
    if (directWalk.duration - bikeSecs < MIN_BIKE_SAVING) {
      showWalkBanner(directWalk.distance, directWalk.duration);
      drawLine(directWalk.geometry.coordinates, '#16a34a', true);
      S.walkIn = S.cycle = S.walkOut = null;
      toast('');
      return;
    }
  }

  S.walkIn = walkIn; S.cycle = cycle; S.walkOut = walkOut;

  if (walkIn)  drawLine(walkIn.geometry.coordinates,  '#6366f1', true);
  if (cycle)   drawLine(cycle.geometry.coordinates,   '#e31837', false);
  if (walkOut) drawLine(walkOut.geometry.coordinates, '#6366f1', true);

  map.fitBounds(L.latLngBounds([
    [S.start.lat,S.start.lon],[S.end.lat,S.end.lon],
    [pickup.lat,pickup.lon],[dropoff.lat,dropoff.lon]
  ]), {padding:[50,50]});

  renderPanel(pickup,dropoff,walkIn,cycle,walkOut,wiDist,woDist);
  toast('');
}

// ─── Journey panel ────────────────────────────────────────────────────────────
function bikeChips(station) {
  const bikes=prop(station,'NbBikes'),ebikes=prop(station,'NbEBikes'),std=bikes-ebikes;
  const c=[];
  if (std>0)    c.push(`<span class="avail-chip chip-std">🚲 ${std} standard</span>`);
  if (ebikes>0) c.push(`<span class="avail-chip chip-ebike">⚡ ${ebikes} e-bike${ebikes>1?'s':''}</span>`);
  if (bikes===0)c.push(`<span class="avail-chip chip-none">No bikes</span>`);
  return c.join(' ');
}

function buildStepRows(route) {
  if (!route) return '';
  let html = '';
  route.legs.forEach(leg => leg.steps.forEach(step => {
    if (step.maneuver.type === 'depart') return;
    const text = step._instruction || stepText(step);
    const d = step.distance > 8 ? fmtDist(step.distance) : '';
    html += `<div class="step-row"><span class="step-ic">${stepIcon(step.maneuver.type,step.maneuver.modifier)}</span><span class="step-txt">${text}</span><span class="step-d">${d}</span></div>`;
  }));
  return html;
}

function renderPanel(pickup,dropoff,walkIn,cycle,walkOut,wiDist,woDist) {
  const total = (walkIn?.duration||0)+(cycle?.duration||0)+(walkOut?.duration||0)+DOCK_OVERHEAD;
  const cDist = cycle ? fmtDist(cycle.distance) : fmtDist(haversine(pickup.lat,pickup.lon,dropoff.lat,dropoff.lon));
  const empty = prop(dropoff,'NbEmptyDocks');
  document.getElementById('journey-summary').innerHTML = `
    <div class="sum-chip"><strong>~${fmtTime(total)} total</strong></div>
    <div class="sum-chip">🚶 ${walkIn?fmtTime(walkIn.duration):fmtDist(wiDist)}</div>
    <div class="sum-chip">🚲 ${cycle?fmtTime(cycle.duration):'?'} · ${cDist}</div>
    <div class="sum-chip">🚶 ${walkOut?fmtTime(walkOut.duration):fmtDist(woDist)}</div>`;
  let steps = '';
  steps += `<div class="step-header">🟣 Walk to pick-up <span class="step-header-line"></span> ${fmtDist(wiDist)}</div>`;
  steps += `<div class="step-row"><span class="step-ic">📍</span><span class="step-txt">${pickup.commonName}</span></div>`;
  steps += `<div class="avail-row">${bikeChips(pickup)}</div>`;
  steps += buildStepRows(walkIn);
  steps += `<div class="step-header">🔴 Cycle <span class="step-header-line"></span> ${cDist}</div>`;
  steps += buildStepRows(cycle);
  steps += `<div class="step-row"><span class="step-ic">🅿</span><span class="step-txt">${dropoff.commonName} · ${empty} empty dock${empty!==1?'s':''}</span></div>`;
  steps += `<div class="step-header">🟣 Walk to destination <span class="step-header-line"></span> ${fmtDist(woDist)}</div>`;
  steps += buildStepRows(walkOut);
  steps += `<div class="step-row"><span class="step-ic">📍</span><span class="step-txt">${S.end.label}</span></div>`;
  document.getElementById('steps-list').innerHTML = steps;
  document.getElementById('journey-panel').classList.add('visible');
  document.getElementById('start-nav-btn').classList.add('visible');
}

// ─── Step text ────────────────────────────────────────────────────────────────
const ICONS = { depart:'▶',arrive:'📍',roundabout:'🔄',rotary:'🔄',merge:'⤵',continue:'↑',
  'turn-left':'↰','turn-right':'↱','turn-slight left':'↖','turn-slight right':'↗',
  'turn-sharp left':'↩','turn-sharp right':'↪','turn-':'↑','fork-left':'↰','fork-right':'↱',
  'end of road':'↱', _:'→' };
function stepIcon(type,mod) { return ICONS[`${type}-${mod}`]||ICONS[type]||ICONS._; }
function stepText(step) {
  if (step._instruction) return step._instruction;
  const {type,modifier:mod} = step.maneuver, road = step.name ? ` on ${step.name}` : '';
  if (type==='depart')   return `Head ${mod||'along'}${road}`;
  if (type==='arrive')   return 'Arrive';
  if (type==='continue') return `Continue${road}`;
  if (type==='turn')     return `Turn ${mod}${road}`;
  if (type==='fork')     return `Keep ${mod}${road}`;
  if (type==='merge')    return `Merge${road}`;
  if (type==='roundabout'||type==='rotary') return `At roundabout, take exit ${step.maneuver.exit||''}${road}`;
  return `${type} ${mod||''}${road}`.trim();
}

// ─── Availability popup + likelihood heuristic ────────────────────────────────
function estimateLikelihood(station, type) {
  // type: 'bike' | 'dock'
  const h = new Date().getHours();
  const isWeekend = [0,6].includes(new Date().getDay());
  const capacity  = prop(station,'NbDocks') || 15;
  const isRush    = !isWeekend && ((h>=7&&h<=9)||(h>=17&&h<=19));
  const isQuiet   = h >= 22 || h <= 6;

  if (isQuiet) return { text: 'Very unlikely soon — very few people cycling at this hour.', color:'#dc2626', wait:'15+ min' };
  if (isRush && capacity >= 10) return { text: 'Good chance — high turnover during rush hour.', color:'#16a34a', wait:'2–5 min' };
  if (isRush)  return { text: 'Possible — moderate activity at this station.', color:'#d97706', wait:'5–10 min' };
  return { text: 'Uncertain — normal daytime activity, hard to predict.', color:'#d97706', wait:'5–15 min' };
}

function showAvailAlert(station, type) {
  const bikes = prop(station,'NbBikes'), docks = prop(station,'NbEmptyDocks');
  const count = type === 'bike' ? usableBikes(station) : docks;
  const thing = type === 'bike' ? 'bike' : 'dock';
  const lh = estimateLikelihood(station, type);

  const isPickup = type === 'bike';
  const emoji = isPickup ? '🚲' : '🅿';
  document.getElementById('avail-popup-title').textContent =
    count === 0 ? `${emoji} No ${thing}s available` : `${emoji} Only ${count} ${thing}${count!==1?'s':''} left`;
  document.getElementById('avail-popup-body').textContent =
    count === 0
      ? `${isPickup?'Pick-up':'Return'} station ${station.commonName} has no ${thing}s right now.`
      : `${isPickup?'Pick-up':'Return'} station ${station.commonName} is very low on ${thing}s.`;
  document.getElementById('avail-popup-likelihood').innerHTML =
    `<span style="color:${lh.color};font-weight:500;">📊 ${lh.text}</span><br><span style="color:#6b7280;">Estimated wait if you stay: ${lh.wait}</span>`;

  pendingAlert = { station, type };
  document.getElementById('avail-popup').classList.add('visible');
}

function hideAvailAlert() {
  document.getElementById('avail-popup').classList.remove('visible');
  pendingAlert = null;
}

async function rerouteStation() {
  const alert = pendingAlert;
  hideAvailAlert();
  if (!alert) return;

  // Not navigating yet: a fresh plan already picks the best stations
  if (!NAV.active) { await loadStations(false); planJourney(); return; }

  toast(alert.type === 'dock' ? 'Finding another return station…' : 'Finding another pick-up station…', 0);
  await loadStations(false);
  const here = NAV.userLat !== undefined
    ? { lat: NAV.userLat, lon: NAV.userLon }
    : (alert.type === 'bike' ? S.start : S.pickup);

  if (alert.type === 'dock') {
    // Prefer a dock with room to spare; settle for 1 space only if nothing else is near
    const newDrop = bestDropoff(here.lat, here.lon, S.end.lat, S.end.lon, S.dropoff.id, LOW_AVAIL).station
                 || bestDropoff(here.lat, here.lon, S.end.lat, S.end.lon, S.dropoff.id, 1).station;
    if (!newDrop) { toast('No other return station with space nearby.',3500); return; }
    const [cy, wo] = await Promise.allSettled([
      fetchCycleRoute(here.lat, here.lon, newDrop.lat, newDrop.lon),
      fetchWalkRoute(newDrop.lat, newDrop.lon, S.end.lat, S.end.lon),
    ]);
    S.dropoff = newDrop;
    S.cycle   = cy.status === 'fulfilled' ? cy.value : null;
    S.walkOut = wo.status === 'fulfilled' ? wo.value : null;
    NAV.steps = buildNavSteps(null, S.cycle, S.walkOut, S.pickup, S.dropoff, 'cycle');
    toast(`Return rerouted to ${newDrop.commonName}`,3500);
  } else {
    const newPickup = bestPickup(here.lat, here.lon, S.dropoff.lat, S.dropoff.lon, S.pickup.id, LOW_AVAIL).station
                   || bestPickup(here.lat, here.lon, S.dropoff.lat, S.dropoff.lon, S.pickup.id, 1).station;
    if (!newPickup) { toast('No other pick-up station with bikes nearby.',3500); return; }
    const [wi, cy] = await Promise.allSettled([
      fetchWalkRoute(here.lat, here.lon, newPickup.lat, newPickup.lon),
      fetchCycleRoute(newPickup.lat, newPickup.lon, S.dropoff.lat, S.dropoff.lon),
    ]);
    S.pickup = newPickup;
    S.walkIn = wi.status === 'fulfilled' ? wi.value : null;
    S.cycle  = cy.status === 'fulfilled' ? cy.value : null;
    NAV.steps = buildNavSteps(S.walkIn, S.cycle, S.walkOut, S.pickup, S.dropoff, 'walk');
    toast(`Pick-up rerouted to ${newPickup.commonName}`,3500);
  }

  NAV.current = 0;
  if (NAV.proximityRefreshId) { clearInterval(NAV.proximityRefreshId); NAV.proximityRefreshId = null; }
  NAV.proximityFor = null;
  redrawJourney();
  renderNavAlternatives();
  updateNavCard();
}

// Redraw lines and pickup/dropoff pins from the current S state
function redrawJourney() {
  routeLayer.clearLayers();
  if (S.walkIn)  drawLine(S.walkIn.geometry.coordinates,  '#6366f1', true);
  if (S.cycle)   drawLine(S.cycle.geometry.coordinates,   '#e31837', false);
  if (S.walkOut) drawLine(S.walkOut.geometry.coordinates, '#6366f1', true);
  if (markerPickup)  markerPickup.setLatLng([S.pickup.lat, S.pickup.lon]);
  if (markerDropoff) markerDropoff.setLatLng([S.dropoff.lat, S.dropoff.lon]);
}

// ─── Navigation ───────────────────────────────────────────────────────────────
// Show amber-ringed alternative stations near pickup and dropoff during navigation
function renderNavAlternatives() {
  navAltLayer.clearLayers();
  if (!S.pickup || !S.dropoff) return;
  const ALT_RADIUS = 350; // metres
  const shown = new Set([S.pickup.id, S.dropoff.id]);
  S.stations.forEach(s => {
    if (shown.has(s.id)) return;
    const nearPickup  = haversine(S.pickup.lat,  S.pickup.lon,  s.lat, s.lon) < ALT_RADIUS;
    const nearDropoff = haversine(S.dropoff.lat, S.dropoff.lon, s.lat, s.lon) < ALT_RADIUS;
    if (!nearPickup && !nearDropoff) return;
    const bikes = prop(s,'NbBikes'), ebikes = prop(s,'NbEBikes');
    const empty = prop(s,'NbEmptyDocks');
    // Only show alts that could actually help
    const useful = nearPickup ? bikes > 0 : empty > 0;
    if (!useful) return;
    const label = nearPickup
      ? `<div class="popup-name">🔄 Alt pick-up</div><div class="popup-avail">${availabilityHTML(s)}</div><div style="font-size:11px;color:#92400e;margin-top:4px;">${s.commonName}</div>`
      : `<div class="popup-name">🔄 Alt return</div><div class="popup-avail">${availabilityHTML(s)}</div><div style="font-size:11px;color:#92400e;margin-top:4px;">${s.commonName}</div>`;
    L.marker([s.lat,s.lon], {icon:makeAltStationIcon(bikes,ebikes), zIndexOffset:400})
      .bindPopup(label)
      .addTo(navAltLayer);
  });
}

function clearNavAlternatives() { navAltLayer.clearLayers(); }

function buildNavSteps(walkIn, cycle, walkOut, pickup, dropoff, fromLeg='walk') {
  const all = [];
  const add = (route, legType) => {
    if (!route) return;
    // skip the router's own 'arrive' steps; the synthetic pickup/dropoff/arrival steps replace them
    route.legs.forEach(leg => leg.steps.forEach(s => { if (s.maneuver?.type !== 'arrive') all.push({...s, legType}); }));
  };
  if (fromLeg !== 'cycle') {
    add(walkIn, 'walk');
    all.push({ legType:'pickup',  _synthetic:true, _label:`Pick up bike at ${pickup.commonName}`,  maneuver:{type:'arrive',location:[pickup.lon,pickup.lat]},  distance:0, duration:60 });
  }
  add(cycle, 'cycle');
  all.push({ legType:'dropoff', _synthetic:true, _label:`Return bike at ${dropoff.commonName}`,  maneuver:{type:'arrive',location:[dropoff.lon,dropoff.lat]}, distance:0, duration:30 });
  add(walkOut, 'walk');
  all.push({ legType:'walk',    _synthetic:true, _label:`Arrived at ${S.end.label}`,             maneuver:{type:'arrive',location:[S.end.lon,S.end.lat]},     distance:0, duration:0  });
  return all;
}

function legCardClass(t) {
  if (t==='cycle') return 'cycle'; if (t==='pickup') return 'pickup'; if (t==='dropoff') return 'dropoff'; return 'walk';
}

function stepLabel(step) {
  if (step._synthetic) return step._label;
  return step._instruction || stepText(step);
}

function stepIconFor(step) {
  if (step._synthetic) return step.legType === 'pickup' ? '🚲' : step.legType === 'dropoff' ? '🅿' : '📍';
  return stepIcon(step.maneuver.type, step.maneuver.modifier);
}

// The card shows the NEXT manoeuvre ("Turn left onto X") and the live distance to it.
// The line under it says what to do until then ("Bike west on Bethnal Green Road").
function updateNavCard() {
  const cur = NAV.steps[NAV.current];
  if (!cur) return;
  const target = NAV.steps[NAV.current + 1] || cur;
  const total = NAV.steps.length;

  let dist = '';
  if (NAV.userLat !== undefined && target.maneuver?.location) {
    const [tLon, tLat] = target.maneuver.location;
    dist = fmtDist(haversine(NAV.userLat, NAV.userLon, tLat, tLon));
  } else if (cur.distance > 8) {
    dist = fmtDist(cur.distance);
  }

  const now = cur._synthetic ? '' : (cur.maneuver.type === 'depart' || cur.maneuver.type === 'continue')
    ? stepLabel(cur).replace(/\.$/, '')
    : (cur.name ? `On ${cur.name}` : '');

  document.getElementById('nav-maneuver').textContent  = stepIconFor(target);
  document.getElementById('nav-primary').textContent   = stepLabel(target);
  document.getElementById('nav-road').textContent      = now;
  document.getElementById('nav-dist').textContent      = dist;
  document.getElementById('nav-card').className        = legCardClass(target.legType === 'walk' && cur.legType === 'cycle' ? 'cycle' : target.legType);
  document.getElementById('nav-step-label').textContent = `Step ${NAV.current+1} / ${total}`;
  document.getElementById('nav-bar-fill').style.width   = `${Math.round((NAV.current/(total-1))*100)}%`;
  const remSecs = NAV.steps.slice(NAV.current).reduce((s,st)=>s+(st.duration||0),0);
  document.getElementById('nav-eta-label').textContent = remSecs>0?`~${fmtTime(remSecs)} left`:'';
}

// ─── Heading, compass and the "in front of you" camera ───────────────────────
const angleDiff = (a, b) => ((a - b + 540) % 360) - 180;          // signed, -180..180
function bearingTo(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, y = Math.sin((lon2 - lon1) * r) * Math.cos(lat2 * r);
  const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lon2 - lon1) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

function onOrientation(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;   // iPhone
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;            // Android
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  h = (h + so + 360) % 360;
  NAV.compass = NAV.compass == null ? h : (NAV.compass + angleDiff(h, NAV.compass) * 0.25 + 360) % 360;  // smooth
  updateHeading();
}

// iPhone sends webkitCompassHeading on 'deviceorientation'; Android sends absolute
// angles on 'deviceorientationabsolute'. Listen for both; onOrientation ignores relative ones.
function startCompass() {
  if (NAV.compassOn) return;
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('deviceorientationabsolute', onOrientation);
  NAV.compassOn = true;
}
function stopCompass() {
  window.removeEventListener('deviceorientation', onOrientation);
  window.removeEventListener('deviceorientationabsolute', onOrientation);
  NAV.compassOn = false; NAV.compass = null;
}

// iPhone asks once; this has to run straight from the Start navigation tap
function requestCompass() {
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    DOE.requestPermission().then(s => s === 'granted' ? startCompass()
      : toast('Compass off: allow Motion & Orientation access to see which way you face', 5000)).catch(() => {});
  } else startCompass();
}

// Point on the current leg ~25 m ahead of you, to judge "facing the right way"
function aheadPoint(lat, lon) {
  const cur = NAV.steps[NAV.current]; if (!cur) return null;
  const pickI = NAV.steps.findIndex(s => s.legType === 'pickup');
  const route = cur.legType === 'cycle' || cur.legType === 'dropoff' ? S.cycle
              : (pickI >= 0 && NAV.current < pickI) ? S.walkIn : S.walkOut;
  const c = route?.geometry?.coordinates; if (!c || c.length < 2) return null;
  let best = 0, bd = Infinity;
  c.forEach(([x, y], i) => { const d = haversine(lat, lon, y, x); if (d < bd) { bd = d; best = i; } });
  let acc = 0;
  for (let i = best; i < c.length - 1; i++) {
    acc += haversine(c[i][1], c[i][0], c[i + 1][1], c[i + 1][0]);
    if (acc >= 25) return { lat: c[i + 1][1], lon: c[i + 1][0] };
  }
  const [x, y] = c[c.length - 1]; return { lat: y, lon: x };
}

function updateHeading() {
  if (!NAV.active) return;
  NAV.heading = NAV.gpsHeading ?? NAV.compass ?? null;
  if (NAV.heading == null) { document.getElementById('nav-facing').style.display = 'none'; return; }
  NAV.userMarker?.setRotation(NAV.heading);
  syncRider();

  // Facing check
  const el = document.getElementById('nav-facing');
  const a = NAV.userLat !== undefined && aheadPoint(NAV.userLat, NAV.userLon);
  if (a) {
    const d = angleDiff(bearingTo(NAV.userLat, NAV.userLon, a.lat, a.lon), NAV.heading);
    const [txt, cls] = Math.abs(d) < 40 ? ['✓ Right way', 'ok'] : Math.abs(d) > 140 ? ['↶ Turn around', 'bad']
                     : d > 0 ? ['↱ Turn right', 'warn'] : ['↰ Turn left', 'warn'];
    el.textContent = txt; el.className = cls; el.style.display = 'block';
  }

  // Heading-up camera: rotate at most ~5x a second, ignore tiny jitter
  if (NAV.view === 'follow' && map._ml) {
    const now = Date.now();
    // don't interrupt a camera move in progress (that cancels the zoom-in); it already carries the heading
    if (!map._ml.isEasing() && now - (NAV.lastRotate || 0) > 200 && Math.abs(angleDiff(NAV.heading, map._ml.getBearing())) > 3) {
      NAV.lastRotate = now;
      map._ml.rotateTo(NAV.heading, { duration: 200 });
    }
  }
}

// Follow view: tilted, rotated to your heading, you in the lower part of the screen
function navCamera(lat, lon) {
  const ml = map._ml; if (!ml) return;
  const h = ml.getContainer().clientHeight;
  const o = { center: [lon, lat], duration: NAV.zoomed ? 800 : 1200 };
  if (NAV.view === 'follow') Object.assign(o, { pitch: 50, zoom: 17.6, bearing: NAV.heading ?? ml.getBearing(), padding: { top: h * 0.45, bottom: 0, left: 0, right: 0 } });
  else Object.assign(o, { pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 }, ...(NAV.zoomed ? {} : { zoom: 16 }) });
  ml.easeTo(o);
  ml.once('moveend', () => { NAV.lastRotate = 0; updateHeading(); });   // catch up on any turn skipped mid-move
  NAV.zoomed = true;
}

function toggleNavView() {
  NAV.view = NAV.view === 'follow' ? 'north' : 'follow';
  document.getElementById('nav-view').textContent = NAV.view === 'follow' ? '🧭 North up' : '🧭 Follow';
  if (NAV.userLat !== undefined) navCamera(NAV.userLat, NAV.userLon);
  syncRider();
}

function resetCamera() {
  map._ml?.easeTo({ pitch: 0, bearing: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 }, duration: 600 });
}

// Keep the screen on while navigating (supported on iPhone from iOS 16.4)
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && NAV.active && !NAV.wakeLock) {
      NAV.wakeLock = await navigator.wakeLock.request('screen');
      NAV.wakeLock.addEventListener('release', () => { NAV.wakeLock = null; });
    }
  } catch(e) { console.warn('Wake lock unavailable:', e.message); }
}
function releaseWakeLock() { try { NAV.wakeLock?.release(); } catch(e) {} NAV.wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && NAV.active) requestWakeLock(); });

// Point S.pickup / S.dropoff at the freshly loaded station objects
function syncJourneyStations() {
  if (S.pickup)  S.pickup  = S.stations.find(s => s.id === S.pickup.id)  || S.pickup;
  if (S.dropoff) S.dropoff = S.stations.find(s => s.id === S.dropoff.id) || S.dropoff;
}

// Bikes that count for the current filter
function usableBikes(st) {
  const bikes = prop(st,'NbBikes'), ebikes = prop(st,'NbEBikes');
  if (S.bikeFilter === 'ebike')    return ebikes;
  if (S.bikeFilter === 'standard') return bikes - ebikes;
  return bikes;
}

// Next pickup/dropoff step ahead and the seconds until we reach it
function nextStationStep() {
  let secs = 0;
  for (let i = NAV.current; i < NAV.steps.length; i++) {
    const st = NAV.steps[i];
    if (st.legType === 'pickup' || st.legType === 'dropoff') return { type: st.legType, secs };
    secs += st.duration || 0;
  }
  return null;
}

// Starts ~5 min before each station: one check straight away, then a poll
// every minute ONLY while that station's count is low.
function startProximityRefresh(type) {
  if (NAV.proximityRefreshId) clearInterval(NAV.proximityRefreshId);
  NAV.proximityFor = type;
  NAV.lastAlert = null;
  doProximityRefresh(true);
  NAV.proximityRefreshId = setInterval(() => doProximityRefresh(false), PROXIMITY_EVERY * 1000);
}

// Re-fetch just the one station (small request), every PROXIMITY_EVERY seconds
async function refreshOneStation(st) {
  try {
    const res = await fetch(`${TFL}/BikePoint/${st.id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const fresh = await res.json();
    const i = S.stations.findIndex(s => s.id === fresh.id);
    if (i >= 0) S.stations[i] = fresh;
    S.lastRefresh = Date.now(); updateBadge();
    return fresh;
  } catch (e) { console.warn('Station check failed:', e.message); return null; }
}

async function doProximityRefresh() {
  if (!NAV.active || !NAV.proximityFor) { clearInterval(NAV.proximityRefreshId); NAV.proximityRefreshId=null; return; }
  const isPickup = NAV.proximityFor === 'pickup';
  const countOf  = st => isPickup ? usableBikes(st) : prop(st,'NbEmptyDocks');

  const fresh = await refreshOneStation(isPickup ? S.pickup : S.dropoff);
  if (!fresh) return;
  if (isPickup) S.pickup = fresh; else S.dropoff = fresh;
  const count = countOf(fresh);

  if (count < LOW_AVAIL) {
    // Getting low: pull the full list too, so the alternatives and reroute are current
    await loadStations(false);
    renderNavAlternatives();
    // After "Wait here", only alert again if it gets worse
    const prev = NAV.lastAlert;
    if (!prev || prev.type !== NAV.proximityFor || count < prev.count) {
      NAV.lastAlert = { type: NAV.proximityFor, count };
      showAvailAlert(isPickup ? S.pickup : S.dropoff, isPickup ? 'bike' : 'dock');
    }
  } else if (NAV.lastAlert && NAV.lastAlert.type === NAV.proximityFor) {
    hideAvailAlert(); NAV.lastAlert = null;            // it recovered: drop the warning
    toast(isPickup ? `🚲 ${count} bikes at ${fresh.commonName} again` : `🅿 ${count} docks free at ${fresh.commonName} again`, 3500);
  }
}

function onNavPosition(pos) {
  const {latitude:lat, longitude:lon} = pos.coords;
  NAV.userLat = lat; NAV.userLon = lon;
  // Blue dot with a beam showing which way you're facing
  const dotHTML = `<svg width="48" height="48" viewBox="0 0 48 48"><defs><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.45"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></linearGradient></defs><path d="M24 24 L12 2 A24 24 0 0 1 36 2 Z" fill="url(#beam)"/></svg>`;
  const dotIcon = L.divIcon({className:'',html:dotHTML,iconSize:[48,48],iconAnchor:[24,24]});
  if (NAV.userMarker) NAV.userMarker.setLatLng([lat,lon]);
  else NAV.userMarker = L.marker([lat,lon],{icon:dotIcon,zIndexOffset:1000,rotationAlignment:'map'}).addTo(map);
  if (NAV.riderMarker) NAV.riderMarker.setLatLng([lat,lon]);
  else NAV.riderMarker = L.marker([lat,lon],{icon:makeRiderIcon(),zIndexOffset:1001}).addTo(map);
  // Moving fast (cycling): GPS course is steadier than the compass
  const {heading, speed} = pos.coords;
  NAV.gpsHeading = (speed != null && speed > 2 && heading != null && !isNaN(heading)) ? heading : null;
  updateHeading();
  navCamera(lat, lon);
  syncRider();


  // Auto-advance steps
  while (NAV.current < NAV.steps.length-1) {
    const next = NAV.steps[NAV.current+1];
    const [nLon,nLat] = next.maneuver.location;
    if (haversine(lat,lon,nLat,nLon) < STEP_ADV_M) {
      NAV.current++;
      if (NAV.current >= NAV.steps.length-1) {
        updateNavCard();
        NAV.arrived = true;
        setTimeout(()=>{ stopNavigation(); toast('🎉 You have arrived!',6000); },1800);
        return;
      }
    } else break;
  }

  // Watch the next station once we're ~5 min from it
  const nxt = nextStationStep();
  if (!nxt) { if (NAV.proximityRefreshId) { clearInterval(NAV.proximityRefreshId); NAV.proximityRefreshId=null; } NAV.proximityFor=null; }
  else if (nxt.secs <= PROXIMITY_SECS && NAV.proximityFor !== nxt.type) startProximityRefresh(nxt.type);

  updateNavCard();
}

function startNavigation() {
  if (!S.walkIn && !S.cycle && !S.walkOut) { toast('Plan a journey first.',3000); return; }
  NAV.steps = buildNavSteps(S.walkIn, S.cycle, S.walkOut, S.pickup, S.dropoff);
  NAV.current = 0; NAV.active = true; NAV.proximityFor = null; NAV.lastAlert = null; NAV.zoomed = false;
  NAV.userLat = NAV.userLon = undefined; NAV.view = 'follow'; NAV.gpsHeading = null;
  document.getElementById('nav-view').textContent = '🧭 North up';
  requestCompass();
  startRider3d();
  requestWakeLock();
  renderStations();
  logJourneyStart();
  document.getElementById('search-panel').classList.add('nav-active');
  document.getElementById('journey-panel').classList.add('nav-active');
  document.getElementById('nav-overlay').classList.add('active');
  document.getElementById('map-legend').style.display = 'none';
  updateNavCard();
  renderNavAlternatives(); // show amber-ringed alt stations
  if (navigator.geolocation) {
    NAV.watchId = navigator.geolocation.watchPosition(onNavPosition,
      err => toast(`GPS: ${err.message}`,4000),
      {enableHighAccuracy:true, maximumAge:1500, timeout:10000});
  }
}

function stopNavigation() {
  NAV.active = false;
  if (NAV.watchId !== null)        { navigator.geolocation.clearWatch(NAV.watchId); NAV.watchId=null; }
  if (NAV.proximityRefreshId)      { clearInterval(NAV.proximityRefreshId); NAV.proximityRefreshId=null; }
  if (NAV.userMarker)              { map.removeLayer(NAV.userMarker); NAV.userMarker=null; }
  if (NAV.riderMarker)             { map.removeLayer(NAV.riderMarker); NAV.riderMarker=null; }
  document.getElementById('search-panel').classList.remove('nav-active');
  document.getElementById('journey-panel').classList.remove('nav-active');
  document.getElementById('nav-overlay').classList.remove('active');
  document.getElementById('map-legend').style.display = '';
  hideAvailAlert();
  clearNavAlternatives();
  logJourneyEnd(NAV.arrived === true);
  releaseWakeLock();
  stopCompass(); resetCamera(); stopRider3d();
  document.getElementById('nav-facing').style.display = 'none';
  NAV.arrived = false; NAV.proximityFor = null;
  renderStations();
}

// ─── Activity (local journey log) ─────────────────────────────────────────────
const HISTORY_KEY = 'sc-history-v1';
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; } }
function saveHistory(h) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 100))); } catch(e) {} }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function logJourneyStart() {
  const h = loadHistory();
  NAV.historyId = Date.now();
  h.unshift({
    id: NAV.historyId, startedAt: NAV.historyId,
    from: S.start?.label, to: S.end?.label,
    pickup: S.pickup?.commonName, dropoff: S.dropoff?.commonName,
    plannedSecs: (S.walkIn?.duration||0) + (S.cycle?.duration||0) + (S.walkOut?.duration||0) + DOCK_OVERHEAD,
    cycleMetres: S.cycle?.distance || 0,
    status: 'started'
  });
  saveHistory(h);
}

function logJourneyEnd(arrived) {
  if (!NAV.historyId) return;
  const h = loadHistory();
  const e = h.find(x => x.id === NAV.historyId);
  if (e) {
    e.endedAt = Date.now();
    e.status = arrived ? 'completed' : 'ended early';
    e.dropoff = S.dropoff?.commonName || e.dropoff; // may have been rerouted
    e.cycleMetres = S.cycle?.distance || e.cycleMetres;
    saveHistory(h);
  }
  NAV.historyId = null;
}

function renderHistory() {
  const h = loadHistory();
  const done = h.filter(x => x.status === 'completed');
  const km = done.reduce((t,x) => t + (x.cycleMetres||0), 0) / 1000;
  document.getElementById('history-totals').innerHTML =
    `<div class="hist-total"><b>${done.length}</b><span>trips completed</span></div>` +
    `<div class="hist-total"><b>${km.toFixed(1)} km</b><span>cycled</span></div>`;
  const list = document.getElementById('history-list');
  if (!h.length) { list.innerHTML = '<div class="hist-empty">No trips yet. Start navigation on a journey and it will show up here.</div>'; return; }
  list.innerHTML = h.map(x => {
    const d = new Date(x.startedAt);
    const when = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) + ' · ' +
                 d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    const took = x.endedAt ? fmtTime((x.endedAt - x.startedAt)/1000) : '–';
    return `<div class="hist-item">
      <div class="hist-route">${esc(x.from)} → ${esc(x.to)}</div>
      <div class="hist-meta">${when} · ${esc(x.status)}<br>
      🚲 ${esc(x.pickup)} → 🅿 ${esc(x.dropoff)}<br>
      Took ${took} (planned ${fmtTime(x.plannedSecs)}) · ${fmtDist(x.cycleMetres||0)} cycled</div>
    </div>`;
  }).join('');
}

// ─── Geolocation — network-first to avoid GPS timeout ────────────────────────
function requestLocation() {
  if (!navigator.geolocation) { toast('Geolocation not supported.',4000); return; }
  toast('Finding your location…',0);
  navigator.geolocation.getCurrentPosition(
    ({coords}) => { setStart(coords.latitude,coords.longitude,'Your location',true); toast('📍 Location found',2000); },
    () => {
      toast('Trying GPS…',0);
      navigator.geolocation.getCurrentPosition(
        ({coords}) => { setStart(coords.latitude,coords.longitude,'Your location',true); toast('📍 Location found',2000); },
        err => toast('Location unavailable — allow access in browser settings.',6000),
        {enableHighAccuracy:true, timeout:20000, maximumAge:0}
      );
    },
    {enableHighAccuracy:false, timeout:5000, maximumAge:120000}
  );
}

function setStart(lat, lon, label, isGPS=false) {
  S.start = {lat,lon,label}; S.startIsGPS = isGPS; S.forceShowBike = false;
  document.getElementById('from-input').value = label;
  document.getElementById('from-clear').classList.add('visible');
  if (markerStart) map.removeLayer(markerStart);
  // GPS gets pulsing blue dot; typed address gets red pin — visually distinct
  markerStart = L.marker([lat,lon], {
    icon: isGPS ? makeGPSIcon() : makeTypedStartIcon(),
    zIndexOffset: 200
  }).addTo(map);
  loadStations();
  if (!S.end) map.setView([lat,lon],14);
}

function setEnd(lat, lon, label) {
  S.end = {lat,lon,label}; S.forceShowBike = false;
  document.getElementById('to-input').value = label;
  document.getElementById('to-clear').classList.add('visible');
  if (markerEnd) map.removeLayer(markerEnd);
  markerEnd = L.marker([lat,lon], {
    icon: L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:#7c3aed;border:3px solid white;box-shadow:0 2px 6px rgba(124,58,237,0.4)"></div>`,iconSize:[14,14],iconAnchor:[7,7]})
  }).addTo(map);
  loadStations();
}

// ─── Autocomplete — Photon (matches partial words), Nominatim fallback ──────
const PHOTON = 'https://photon.komoot.io/api/';
const MIN_QUERY = 3; // letters (not counting the house number) before suggestions start
const letterCount = q => splitHouseNumber(q).rest.replace(/[^a-z]/gi, '').length;

// "5 Scawfell", "12a high st" → { num: '5', rest: 'Scawfell' }
function splitHouseNumber(q) {
  const m = q.match(/^\s*(\d+[a-zA-Z]?)\b[\s,]*(.*)$/);
  return m && m[2] ? { num: m[1], rest: m[2] } : { num: null, rest: q };
}

function biasPoint() {
  if (S.start) return S.start;
  const c = map.getCenter();
  return { lat: c.lat, lon: c.lng };
}

async function getSuggestions(q) {
  try {
    return await photonSuggestions(q);
  } catch(e) {
    console.warn('Photon failed, falling back to Nominatim:', e.message);
    return nominatimSuggestions(q, splitHouseNumber(q).num);
  }
}

async function photonRaw(q) {
  const b = biasPoint();
  const res = await fetch(`${PHOTON}?q=${encodeURIComponent(q)}&limit=10&lang=en&bbox=-0.52,51.26,0.35,51.72&lat=${b.lat}&lon=${b.lon}`);
  if (!res.ok) throw new Error(`Photon ${res.status}`);
  return (await res.json()).features || [];
}

const isStreetFeature = f => f.properties?.osm_key === 'highway' || f.properties?.type === 'street';

function photonItem(f, num) {
  const p = f.properties || {};
  const [lon, lat] = f.geometry.coordinates;
  const area = [p.district || p.locality || p.city, p.postcode].filter(Boolean).join(' · ');
  const addr = [p.housenumber, p.street].filter(Boolean).join(' ');
  if (p.name && !isStreetFeature(f) && !(p.osm_key === 'place' && p.osm_value === 'house'))
    return { main: p.name, sub: [addr, area].filter(Boolean).join(' · '), lat, lon,                // named place: pub, shop, station
             dedupe: `${p.name}|${addr}`.toLowerCase() };
  if (p.housenumber)
    return { main: `${p.housenumber} ${p.street || p.name || ''}`, sub: area, lat, lon,            // exact address
             dedupe: `${p.housenumber} ${p.street || p.name || ''}|${p.district || p.locality || ''}`.toLowerCase() };
  if (num && isStreetFeature(f))
    return { main: `${num} ${p.name}`, sub: ['Street level', area].filter(Boolean).join(' · '),    // keep typed number
             lat, lon, dedupe: `${num} ${p.name}|${p.district || p.locality || ''}`.toLowerCase() };
  return { main: p.name || p.street || 'Location',
           sub: [p.name && p.street && p.street !== p.name ? p.street : '', area].filter(Boolean).join(' · '), lat, lon };
}

async function photonSuggestions(q) {
  const { num, rest } = splitHouseNumber(q);
  let items;
  if (num) {
    // The number confuses prefix matching, so search the street on its own,
    // and the full text in parallel to catch addresses that do have numbers mapped.
    const [full, street] = await Promise.all([photonRaw(q), photonRaw(rest)]);
    const firstWord = rest.trim().split(/\s+/)[0].toLowerCase();
    const exact = full.filter(f => String(f.properties.housenumber || '').toLowerCase() === num.toLowerCase()
                              && String(f.properties.street || f.properties.name || '').toLowerCase().includes(firstWord))
                      .map(f => photonItem(f, num));
    items = [...exact,
             ...street.filter(isStreetFeature).map(f => photonItem(f, num)),
             ...street.filter(f => !isStreetFeature(f)).map(f => photonItem(f, null))];
  } else {
    items = (await photonRaw(q)).map(f => photonItem(f, null));
  }
  const seen = new Set();
  return items.filter(x => {
    const k = x.dedupe || (x.main + '|' + x.sub).toLowerCase();   // one row per street stretch, nearest first
    if (!x.main || seen.has(k)) return false;
    seen.add(k); return true;
  }).slice(0, 6);
}

async function nominatimSuggestions(q, num) {
  const url = `${NOMINATIM}/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=6&countrycodes=gb&accept-language=en&bounded=1&viewbox=-0.52,51.72,0.35,51.26`;
  const res  = await fetch(url, {headers:{'User-Agent':'RotharBikePlanner/1.0'}});
  const data = await res.json();
  return data.map(item => {
    const addr = item.address||{};
    const road  = addr.road || addr.pedestrian || addr.footway || addr.path || '';
    const area  = [addr.suburb||addr.city_district, addr.postcode].filter(Boolean).join(' · ');
    let main, sub = area;
    if (addr.house_number) main = `${addr.house_number} ${road}`;
    else if (num && road) { main = `${num} ${road}`; sub = ['Street level', area].filter(Boolean).join(' · '); }
    else main = road || item.display_name.split(',')[0];
    return { main: main.trim(), sub, lat: parseFloat(item.lat), lon: parseFloat(item.lon) };
  }).filter(x => x.main);
}

function bindAutocomplete(inputId, listId, onSelect) {
  const input = document.getElementById(inputId);
  const list  = document.getElementById(listId);
  let timer, cache = {};
  const hide = () => list.style.display = 'none';
  const show = items => {
    if (!items.length) { hide(); return; }
    list.innerHTML = items.map((it,i) =>
      `<div class="ac-item" data-i="${i}"><div><div class="ac-main">${it.main}</div><div class="ac-sub">${it.sub}</div></div></div>`
    ).join('');
    list.style.display = 'block';
    list.querySelectorAll('.ac-item').forEach(el => el.addEventListener('mousedown', e => {
      e.preventDefault();
      const it = items[parseInt(el.dataset.i)];
      hide(); onSelect(it.lat, it.lon, it.main);
    }));
  };
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (letterCount(q) < MIN_QUERY) { hide(); return; }
    if (cache[q]) { show(cache[q]); return; }
    timer = setTimeout(async () => {
      try { const its = await getSuggestions(q); cache[q] = its; if (document.activeElement===input) show(its); }
      catch(e) { hide(); }
    }, 300);
  });
  input.addEventListener('blur',  () => setTimeout(hide, 200));
  input.addEventListener('focus', () => { const q=input.value.trim(); if(letterCount(q)>=MIN_QUERY&&cache[q]) show(cache[q]); });
  input.addEventListener('keydown', e => { if(e.key==='Escape') hide(); });
}

// ─── Clear buttons ─────────────────────────────────────────────────────────────
document.getElementById('from-input').addEventListener('input', function() {
  document.getElementById('from-clear').classList.toggle('visible', this.value.length > 0);
});
document.getElementById('to-input').addEventListener('input', function() {
  document.getElementById('to-clear').classList.toggle('visible', this.value.length > 0);
});
document.getElementById('from-clear').addEventListener('click', () => {
  document.getElementById('from-input').value = '';
  document.getElementById('from-clear').classList.remove('visible');
  S.start = null; S.startIsGPS = false; S.forceShowBike = false;
  if (markerStart) { map.removeLayer(markerStart); markerStart=null; }
  hideWalkBanner(); renderStations();
});
document.getElementById('to-clear').addEventListener('click', () => {
  document.getElementById('to-input').value = '';
  document.getElementById('to-clear').classList.remove('visible');
  S.end = null; S.forceShowBike = false;
  if (markerEnd) { map.removeLayer(markerEnd); markerEnd=null; }
  routeLayer.clearLayers();
  document.getElementById('journey-panel').classList.remove('visible');
  document.getElementById('start-nav-btn').classList.remove('visible');
  hideWalkBanner(); renderStations();
  S.journeyActive = false;
});

// ─── Wire up all controls ─────────────────────────────────────────────────────
document.getElementById('loc-btn').addEventListener('click', requestLocation);
document.getElementById('refresh-btn').addEventListener('click', () => loadStations(true));
document.getElementById('start-nav-btn').addEventListener('click', startNavigation);
document.getElementById('nav-stop').addEventListener('click', stopNavigation);
document.getElementById('nav-view').addEventListener('click', toggleNavView);
document.getElementById('history-btn').addEventListener('click', () => { renderHistory(); document.getElementById('history-panel').classList.add('visible'); });
document.getElementById('history-close').addEventListener('click', () => document.getElementById('history-panel').classList.remove('visible'));
document.getElementById('walk-anyway-btn').addEventListener('click', () => {
  S.forceShowBike = true; hideWalkBanner(); planJourney();
});

// Bike type filter
document.querySelectorAll('#filter-row .pill-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#filter-row .pill-btn').forEach(b => b.classList.remove('active-red'));
  btn.classList.add('active-red');
  S.bikeFilter = btn.dataset.filter;
  renderStations();
  if (S.start && S.end) planJourney();
}));

// Route type
document.querySelectorAll('#route-row .pill-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#route-row .pill-btn').forEach(b => b.classList.remove('active-blue'));
  btn.classList.add('active-blue');
  S.routeType = btn.dataset.rt;
  if (S.start && S.end) planJourney();
}));

// Availability popup actions
document.getElementById('avail-popup-close').addEventListener('click', hideAvailAlert);
document.getElementById('avail-wait').addEventListener('click', hideAvailAlert);
document.getElementById('avail-reroute').addEventListener('click', rerouteStation);

bindAutocomplete('from-input','from-ac',(lat,lon,label)=>setStart(lat,lon,label,false));
bindAutocomplete('to-input',  'to-ac',  setEnd);

// Re-render exploration-mode stations when the map moves
let moveTimer;
map.on('moveend', () => { if (!S.start && !S.end && !NAV.active) { clearTimeout(moveTimer); moveTimer = setTimeout(renderStations, 150); } });

// ─── Boot ─────────────────────────────────────────────────────────────────────
setInterval(updateBadge, 15000);
loadStations();
setTimeout(requestLocation, 600);
</script>
